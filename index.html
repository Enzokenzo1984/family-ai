<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#eee6df">

  <title>Family AI Ultimate v11.1.1.1 Personality DNA Scope Hotfix</title>

  <style>
    :root {
      --background-top: #f7f2ed;
      --background-bottom: #d9cec4;
      --text-main: #342f2b;
      --text-soft: #776e67;
      --card: rgba(255, 255, 255, 0.76);
      --button: #352f2b;
      --button-active: #594f48;
      --shadow: rgba(61, 48, 38, 0.18);
      --error: #9b3b32;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--background-bottom);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      color: var(--text-main);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: 100%;
      max-width: 460px;
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        calc(18px + env(safe-area-inset-top))
        18px
        calc(22px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      background:
        radial-gradient(
          circle at 50% 15%,
          rgba(255, 255, 255, 0.9),
          transparent 38%
        ),
        linear-gradient(
          180deg,
          var(--background-top),
          var(--background-bottom)
        );
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-name {
      margin: 0;
      font-size: 17px;
      font-weight: 750;
    }

    .connection-status {
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.68);
      color: var(--text-soft);
      font-size: 12px;
      font-weight: 650;
    }

    .connection-status.online {
      color: #306442;
    }

    .connection-status.error {
      color: var(--error);
    }

    .avatar-section {
      width: 100%;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }


    /* v13.1：静态头像稍微下移，避免头发被圆形边缘裁掉。 */
    .avatar-frame .avatar-motion-group {
      transform: translateY(18px) scale(0.965);
      transform-origin: center center;
    }

    .liveavatar-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 34%;
      border-radius: inherit;
      z-index: 8;
      display: none;
      background: #24211f;
    }

    .avatar-frame.liveavatar-active
      .liveavatar-video {
      display: block;
    }

    .avatar-frame.liveavatar-active
      .avatar-motion-group,
    .avatar-frame.liveavatar-active
      .avatar-placeholder {
      visibility: hidden;
    }

    .liveavatar-toggle {
      margin-top: 12px;
      border: 1px solid rgba(63, 54, 47, 0.18);
      border-radius: 999px;
      padding: 9px 16px;
      background: rgba(255, 255, 255, 0.68);
      color: #3d352f;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(76, 61, 50, 0.08);
    }

    .liveavatar-toggle:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .liveavatar-toggle.active {
      background: #3c3530;
      color: #fff;
    }

    .liveavatar-state {
      margin-top: 7px;
      min-height: 18px;
      color: #84786f;
      font-size: 12px;
    }

    .avatar-frame {
      position: relative;
      width: 340px;
      height: 340px;
      max-width: calc(100vw - 36px);
      max-height: calc(100vw - 36px);
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.86);
      padding: 8px;
      box-shadow:
        0 22px 55px var(--shadow),
        inset 0 0 0 1px rgba(255, 255, 255, 0.85);
      overflow: visible;
    }

    .avatar-motion-group {
      --left-eye-x: 41.05%;
      --left-eye-y: 35.25%;
      --left-eye-w: 7.3%;
      --left-eye-h: 2.35%;

      --right-eye-x: 51.15%;
      --right-eye-y: 35.05%;
      --right-eye-w: 7.0%;
      --right-eye-h: 2.3%;

      --mouth-x: 45.55%;
      --mouth-y: 46.25%;
      --mouth-w: 10.1%;
      --mouth-h: 4.15%;
      --mouth-open: 0.08;

      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      transform-origin: 50% 58%;
      will-change: transform;
      animation: avatarIdleBreath 6.8s ease-in-out infinite;
    }

    .avatar-image,
    .avatar-placeholder {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .avatar-image {
      display: block;
      object-fit: cover;
      object-position: center;
      transform: scale(1.01);
    }

    .avatar-placeholder {
      display: none;
      justify-content: center;
      align-items: center;
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.98),
        rgba(224, 213, 204, 0.9)
      );
      font-size: 112px;
    }

    .avatar-glow {
      position: absolute;
      inset: -14px;
      z-index: -1;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.34);
      filter: blur(14px);
    }

    .avatar-frame.listening .avatar-motion-group {
      animation: avatarListening 3.6s ease-in-out infinite;
    }

    .avatar-frame.thinking .avatar-motion-group {
      animation: avatarThinking 4.4s ease-in-out infinite;
    }

    .avatar-frame.speaking .avatar-motion-group {
      animation: avatarSpeaking 3.2s ease-in-out infinite;
    }


    .face-mesh-status {
      position: absolute;
      left: 50%;
      bottom: -34px;
      transform: translateX(-50%);
      z-index: 8;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 26px;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 8px 24px rgba(30, 22, 18, 0.12);
      color: rgba(50, 40, 34, 0.82);
      font-size: 11px;
      line-height: 1;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 180ms ease;
      pointer-events: none;
    }

    .face-mesh-status.visible {
      opacity: 1;
    }

    .face-mesh-status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(83, 149, 99, 0.92);
      box-shadow: 0 0 0 4px rgba(83, 149, 99, 0.12);
    }

    .face-mesh-status.error::before {
      background: rgba(184, 83, 83, 0.92);
      box-shadow: 0 0 0 4px rgba(184, 83, 83, 0.12);
    }

    .face-mesh-status.loading::before {
      background: rgba(189, 137, 63, 0.92);
      animation: meshStatusPulse 1s ease-in-out infinite;
    }

    @keyframes meshStatusPulse {
      0%, 100% {
        transform: scale(0.82);
        opacity: 0.55;
      }

      50% {
        transform: scale(1.08);
        opacity: 1;
      }
    }

    .avatar-live-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      border-radius: 50%;
      overflow: hidden;
      pointer-events: none;
    }

    .live-eye {
      position: absolute;
      border-radius: 50%;
      background:
        linear-gradient(
          to bottom,
          rgba(150, 91, 76, 0.18),
          rgba(178, 112, 91, 0.82) 48%,
          rgba(130, 76, 65, 0.22)
        );
      transform-origin: center;
      filter: blur(0.7px);
      opacity: 0;
      pointer-events: none;
      transition:
        opacity 55ms linear,
        transform 55ms ease-in;
    }

    .live-eye.left {
      left: var(--left-eye-x);
      top: var(--left-eye-y);
      width: var(--left-eye-w);
      height: var(--left-eye-h);
      transform: rotate(-3deg) scaleY(0.05);
    }

    .live-eye.right {
      left: var(--right-eye-x);
      top: var(--right-eye-y);
      width: var(--right-eye-w);
      height: var(--right-eye-h);
      transform: rotate(2deg) scaleY(0.05);
    }

    .avatar-motion-group.is-blinking .live-eye {
      opacity: 0.76;
    }

    .avatar-motion-group.is-blinking .live-eye.left {
      transform: rotate(-3deg) scaleY(1);
    }

    .avatar-motion-group.is-blinking .live-eye.right {
      transform: rotate(2deg) scaleY(1);
    }

    .live-mouth {
      position: absolute;
      left: var(--mouth-x);
      top: var(--mouth-y);
      width: var(--mouth-w);
      height: var(--mouth-h);
      border-radius: 46% 46% 54% 54%;
      background:
        radial-gradient(
          ellipse at 50% 48%,
          rgba(55, 16, 19, 0.88) 0%,
          rgba(77, 26, 29, 0.75) 40%,
          rgba(137, 62, 62, 0.18) 66%,
          rgba(137, 62, 62, 0) 75%
        );
      opacity: 0;
      transform:
        scaleY(calc(0.08 + var(--mouth-open) * 0.9))
        scaleX(calc(1 - var(--mouth-open) * 0.08));
      transform-origin: 50% 42%;
      filter: blur(0.5px);
      transition:
        opacity 70ms linear,
        transform 55ms linear;
      pointer-events: none;
    }

    .avatar-frame.speaking .live-mouth {
      opacity: calc(0.25 + var(--mouth-open) * 0.55);
    }
    .avatar-motion-group.fallback-mouth-active .live-mouth {
      opacity: 0.62;
      animation: fallbackMouthPulse 0.22s ease-in-out infinite alternate;
    }

    @keyframes fallbackMouthPulse {
      0% {
        transform: scaleY(0.16) scaleX(0.98);
      }

      45% {
        transform: scaleY(0.48) scaleX(0.94);
      }

      100% {
        transform: scaleY(0.82) scaleX(0.9);
      }
    }


    @keyframes avatarIdleBreath {
      0%, 100% {
        transform: translate3d(0, 0, 0) scale(1);
      }
      50% {
        transform: translate3d(0, -0.7px, 0) scale(1.0025);
      }
    }

    @keyframes avatarListening {
      0%, 100% {
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
      }
      45% {
        transform: translate3d(-0.5px, -0.8px, 0) rotate(-0.12deg) scale(1.002);
      }
      72% {
        transform: translate3d(0.4px, -0.3px, 0) rotate(0.1deg) scale(1.001);
      }
    }

    @keyframes avatarThinking {
      0%, 100% {
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
      }
      50% {
        transform: translate3d(0.7px, -0.5px, 0) rotate(0.11deg) scale(1.0018);
      }
    }

    @keyframes avatarSpeaking {
      0%, 100% {
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
      }
      28% {
        transform: translate3d(-0.4px, -0.6px, 0) rotate(-0.08deg) scale(1.0018);
      }
      63% {
        transform: translate3d(0.45px, -0.3px, 0) rotate(0.09deg) scale(1.0012);
      }
    }

      35% {
        transform: scaleY(0.52) scaleX(0.93);
        opacity: 0.64;
      }
      70% {
        transform: scaleY(0.88) scaleX(0.9);
        opacity: 0.72;
      }
      100% {
        transform: scaleY(0.38) scaleX(0.95);
        opacity: 0.55;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .avatar-motion-group {
        animation: avatarIdleBreath 10s ease-in-out infinite !important;
      }

      .avatar-frame.listening .avatar-motion-group,
      .avatar-frame.thinking .avatar-motion-group,
      .avatar-frame.speaking .avatar-motion-group {
        animation: avatarIdleBreath 10s ease-in-out infinite !important;
      }

      .avatar-motion-group.is-blinking .live-eye {
        opacity: 0.66;
      }

      .avatar-frame.speaking .live-mouth {
        opacity: calc(0.24 + var(--mouth-open) * 0.5);
      }
    }


    .name {
      margin: 17px 0 4px;
      font-size: 29px;
      line-height: 1.2;
    }

    .status {
      margin: 0;
      color: var(--text-soft);
      font-size: 15px;
    }

    .conversation-card {
      width: 100%;
      min-height: 108px;
      margin-top: 18px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 25px;
      background: var(--card);
      box-shadow: 0 14px 35px rgba(61, 48, 38, 0.09);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .speaker-label {
      margin-bottom: 7px;
      color: var(--text-soft);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.5px;
    }

    .message {
      margin: 0;
      font-size: 18px;
      line-height: 1.55;
      word-break: break-word;
    }

    .text-entry {
      width: 100%;
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }

    .text-input {
      min-width: 0;
      flex: 1;
      height: 46px;
      padding: 0 15px;
      border: 1px solid rgba(70, 60, 52, 0.12);
      border-radius: 16px;
      outline: none;
      background: rgba(255, 255, 255, 0.76);
      color: var(--text-main);
      font-size: 16px;
    }

    .text-input:focus {
      border-color: rgba(53, 47, 43, 0.35);
      background: rgba(255, 255, 255, 0.92);
    }

    .send-button {
      width: 66px;
      height: 46px;
      border: 0;
      border-radius: 16px;
      background: rgba(53, 47, 43, 0.9);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .send-button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .controls {
      width: 100%;
      margin-top: auto;
      padding-top: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .talk-button {
      position: relative;
      width: 84px;
      height: 84px;
      border: 0;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--button);
      color: white;
      box-shadow:
        0 16px 35px rgba(52, 47, 43, 0.3),
        inset 0 -2px 0 rgba(0, 0, 0, 0.12);
      cursor: pointer;
      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .talk-button:active {
      transform: scale(0.94);
    }

    .talk-button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .talk-button.active::before {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 3px solid rgba(53, 47, 43, 0.24);
      animation: pulse-ring 1.2s ease-out infinite;
    }

    .microphone-icon {
      font-size: 34px;
      line-height: 1;
    }

    .hint {
      margin: 12px 0 0;
      color: var(--text-soft);
      font-size: 13px;
      text-align: center;
    }

    .small-note {
      margin: 10px 0 0;
      color: rgba(70, 62, 56, 0.58);
      font-size: 11px;
      text-align: center;
      line-height: 1.4;
    }

    @keyframes breathe {
      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-4px) scale(1.018);
      }
    }

    @keyframes speaking {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.04);
      }
    }

    @keyframes listening {
      from {
        transform: scale(1);
        box-shadow:
          0 22px 55px var(--shadow),
          0 0 0 0 rgba(53, 47, 43, 0.16);
      }

      to {
        transform: scale(1.025);
        box-shadow:
          0 22px 55px var(--shadow),
          0 0 0 16px rgba(53, 47, 43, 0);
      }
    }

    @keyframes thinking {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(0.9);
        opacity: 0.8;
      }

      100% {
        transform: scale(1.35);
        opacity: 0;
      }
    }

    @media (max-width: 390px) {
      .avatar-frame {
        width: 320px;
        height: 320px;
      }
    }

    @media (max-height: 780px) {
      .avatar-frame {
        width: 278px;
        height: 278px;
      }

      .avatar-section {
        margin-top: 8px;
      }

      .name {
        margin-top: 11px;
        font-size: 25px;
      }

      .conversation-card {
        min-height: 92px;
        margin-top: 12px;
      }

      .controls {
        padding-top: 12px;
      }

      .talk-button {
        width: 72px;
        height: 72px;
      }
    }

    /* ===== Family User Profile Selector ===== */

    .profile-button {
      border: 0;
      border-radius: 999px;
      padding: 7px 11px;
      background: rgba(255, 255, 255, 0.68);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
    }

    .profile-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(40, 34, 30, 0.42);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .profile-modal.open {
      display: flex;
    }

    .profile-panel {
      width: min(390px, 100%);
      padding: 24px;
      border-radius: 26px;
      background: #f7f2ed;
      box-shadow: 0 24px 70px rgba(30, 24, 20, 0.28);
    }

    .profile-panel h2 {
      margin: 0 0 6px;
      font-size: 25px;
      color: var(--text-main);
    }

    .profile-panel p {
      margin: 0 0 18px;
      color: var(--text-soft);
      line-height: 1.5;
    }

    .profile-options {
      display: grid;
      gap: 10px;
    }

    .profile-option {
      width: 100%;
      border: 1px solid rgba(60, 48, 38, 0.10);
      border-radius: 17px;
      padding: 14px 16px;
      text-align: left;
      background: rgba(255, 255, 255, 0.82);
      color: var(--text-main);
      font-size: 16px;
      font-weight: 750;
      cursor: pointer;
    }

    .profile-option small {
      display: block;
      margin-top: 3px;
      color: var(--text-soft);
      font-size: 12px;
      font-weight: 600;
    }


    .usage-status {
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.60);
      color: var(--text-soft);
      font-size: 12px;
      font-weight: 700;
    }

    .usage-status.warning {
      color: #8a5a12;
      background: rgba(255, 241, 207, 0.82);
    }

    .usage-status.limit {
      color: var(--error);
      background: rgba(255, 226, 222, 0.86);
    }


    .language-button {
      border: 0;
      border-radius: 999px;
      padding: 7px 11px;
      background: rgba(255, 255, 255, 0.68);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
    }

    .language-modal {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(40, 34, 30, 0.42);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .language-modal.open {
      display: flex;
    }

    .language-panel {
      width: min(390px, 100%);
      padding: 24px;
      border-radius: 26px;
      background: #f7f2ed;
      box-shadow: 0 24px 70px rgba(30, 24, 20, 0.28);
    }

    .language-panel h2 {
      margin: 0 0 6px;
      font-size: 25px;
    }

    .language-panel p {
      margin: 0 0 18px;
      color: var(--text-soft);
      line-height: 1.5;
    }

    .language-options {
      display: grid;
      gap: 10px;
    }

    .language-option {
      width: 100%;
      border: 1px solid rgba(60, 48, 38, 0.10);
      border-radius: 17px;
      padding: 14px 16px;
      text-align: left;
      background: rgba(255, 255, 255, 0.82);
      color: var(--text-main);
      font-size: 16px;
      font-weight: 750;
      cursor: pointer;
    }

    .language-option small {
      display: block;
      margin-top: 3px;
      color: var(--text-soft);
      font-size: 12px;
      font-weight: 600;
    }

  </style>
</head>

<body>
  <main class="app">

    <header class="top-bar">
      <p class="app-name">Family AI</p>

      <div style="display:flex; align-items:center; gap:7px;">
        <button
          class="profile-button"
          id="profileButton"
          type="button"
        >
          选择人物
        </button>

        <button
          class="language-button"
          id="languageButton"
          type="button"
        >
          中文
        </button>

        <span
          class="connection-status"
          id="connectionStatus"
        >
          检查连接
        </span>
      </div>
    </header>

    <section class="avatar-section">

      <div class="avatar-frame" id="avatarFrame">
        <div class="avatar-glow"></div>

        <div class="avatar-motion-group">
          <img
            class="avatar-image"
            id="avatarImage"

      applyPoint("left-eye", faceData.leftEye);
      applyPoint("right-eye", faceData.rightEye);
      applyPoint("mouth", faceData.mouth);

      avatarMotionGroup.dataset.faceMesh = "ready";

    async function loadAmeiPersonalityDNA() {

    function scheduleNaturalBlink() {
      if (!avatarMotionGroup) {
        return;
      }

      clearTimeout(blinkTimer);

      const delay =
        2600 + Math.floor(Math.random() * 4400);

      blinkTimer = setTimeout(function () {
        const doubleBlink = Math.random() < 0.16;

        avatarMotionGroup.classList.add("is-blinking");

        setTimeout(function () {
          avatarMotionGroup.classList.remove("is-blinking");

          if (doubleBlink) {
            setTimeout(function () {
              avatarMotionGroup.classList.add("is-blinking");

              setTimeout(function () {
                avatarMotionGroup.classList.remove("is-blinking");
                scheduleNaturalBlink();
              }, 105);
            }, 145);
          } else {
            scheduleNaturalBlink();
          }
        }, 115);
      }, delay);
    }

    function stopAudioReactiveMouth() {
      if (mouthAnimationFrame) {
        cancelAnimationFrame(mouthAnimationFrame);
        mouthAnimationFrame = null;
      }

      mouthSmoothedLevel = 0;

      if (avatarMotionGroup) {
        avatarMotionGroup.style.setProperty(
          "--mouth-open",
          "0.08"
        );

        avatarMotionGroup.classList.remove(
          "fallback-mouth-active"
        );
      }

      if (voiceSourceNode) {
        try {
          voiceSourceNode.disconnect();
        } catch {
          // Already disconnected.
        }

        voiceSourceNode = null;
      }

      voiceAnalyser = null;
    }

    async function startAudioReactiveMouth(audioElement) {
      stopAudioReactiveMouth();

      if (!avatarMotionGroup || !audioElement) {
        return;
      }

      try {
        audioContext =
          audioContext ||
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )();

        if (audioContext.state === "suspended") {
          await audioContext.resume();
        }

        voiceAnalyser = audioContext.createAnalyser();
        voiceAnalyser.fftSize = 256;
        voiceAnalyser.smoothingTimeConstant = 0.7;

        voiceSourceNode =
          audioContext.createMediaElementSource(
            audioElement
          );

        voiceSourceNode.connect(voiceAnalyser);
        voiceAnalyser.connect(audioContext.destination);

        const data = new Uint8Array(
          voiceAnalyser.frequencyBinCount
        );

        function animateMouthFromAudio() {
          if (!voiceAnalyser || !currentVoiceAudio) {
            return;
          }

          voiceAnalyser.getByteFrequencyData(data);

          let total = 0;
          const usefulBins = Math.min(40, data.length);

          for (let i = 2; i < usefulBins; i += 1) {
            total += data[i];
          }

          const rawLevel =
            total / Math.max(1, usefulBins - 2) / 255;

          const gatedLevel =
            rawLevel < 0.035
              ? 0.04
              : Math.min(1, rawLevel * 2.45);

          mouthSmoothedLevel =
            mouthSmoothedLevel * 0.72 +
            gatedLevel * 0.28;

          avatarMotionGroup.style.setProperty(
            "--mouth-open",
            mouthSmoothedLevel.toFixed(3)
          );

          mouthAnimationFrame =
            requestAnimationFrame(
              animateMouthFromAudio
            );
        }

        animateMouthFromAudio();
      } catch (error) {
        console.warn(
          "Audio reactive mouth unavailable:",
          error
        );

        avatarMotionGroup.style.setProperty(
          "--mouth-open",
          "0.34"
        );

        avatarMotionGroup.classList.add(
          "fallback-mouth-active"
        );
      }
    }

        usageStatus.classList.add("warning");

        sendButton.disabled = false;
        textInput.disabled = false;
      }

    function findChineseVoice() {
      const voices =
        window.speechSynthesis.getVoices();

      return (
        voices.find(function (voice) {
          return voice.lang === "zh-CN";
        }) ||
        voices.find(function (voice) {
          return voice.lang === "zh-TW";
        }) ||
        voices.find(function (voice) {
          return voice.lang === "zh-HK";
        }) ||
        voices.find(function (voice) {
          return voice.lang
            .toLowerCase()
            .startsWith("zh");
        }) ||
        null
      );
    }

    function registerLiveAvatarEvents(
      sdk,
      session
    ) {
      const SessionEvent =
        sdk?.SessionEvent || {};

      const readyEvent =
        SessionEvent.SESSION_STREAM_READY ||
        "session_stream_ready";

      const disconnectedEvent =
        SessionEvent.SESSION_DISCONNECTED ||
        "session_disconnected";

      const stateEvent =
        SessionEvent.SESSION_STATE_CHANGED ||
        "session_state_changed";

      session.on(
        readyEvent,
        function () {
          try {
            liveAvatarVideo.muted = true;

            session.attach(
              liveAvatarVideo
            );

            liveAvatarVideo
              .play()
              .catch(() => {});

            setLiveAvatarUi(
              true,
              "Live Avatar 已连接"
            );
          } catch (error) {
            console.error(
              "LiveAvatar attach failed:",
              error
            );

            fallbackToFamilyAI(
              "动态画面连接失败"
            );
          }
        }
      );

      session.on(
        disconnectedEvent,
        function () {
          fallbackToFamilyAI(
            "LiveAvatar 已断线"
          );
        }
      );

      const speakStartedEvent =
        sdk?.AgentEventsEnum?.AVATAR_SPEAK_STARTED ||
        sdk?.AgentEvent?.AVATAR_SPEAK_STARTED ||
        "avatar.speak_started";

      const speakEndedEvent =
        sdk?.AgentEventsEnum?.AVATAR_SPEAK_ENDED ||
        sdk?.AgentEvent?.AVATAR_SPEAK_ENDED ||
        "avatar.speak_ended";

      session.on(
        speakStartedEvent,
        function (event) {
          liveAvatarLastSpeakStartedAt = Date.now();
          liveAvatarLastAudioEventId =
            String(event?.event_id || "");
          clearLiveAvatarSpeechWatchdog();
          liveAvatarState.textContent =
            "Live Avatar 嘴型同步中";
        }
      );

      session.on(
        speakEndedEvent,
        function () {
          liveAvatarLastSpeakEndedAt = Date.now();
          clearLiveAvatarSpeechWatchdog();
          liveAvatarState.textContent =
            "Live Avatar 已连接";
          setAvatarMode("");
        }
      );

      session.on(
        stateEvent,
        function (state) {
          const stateText =
            String(state || "")
              .toLowerCase();

          if (
            stateText.includes(
              "disconnect"
            ) ||
            stateText.includes(
              "inactive"
            )
          ) {
            fallbackToFamilyAI(
              "LiveAvatar Session 已结束"
            );
          }
        }
      );
    }

    async function startLiveAvatar() {
      if (
        liveAvatarStarting ||
        liveAvatarActive
      ) {
        return;
      }

      liveAvatarStarting = true;
      liveAvatarToggle.disabled = true;
      liveAvatarState.textContent =
        "正在连接 Live Avatar";

      try {
        const tokenData =
          await fetchLiveAvatarAction(
            "liveavatar_token"
          );

        if (
          !tokenData?.available ||
          !tokenData?.sessionToken
        ) {
          await fallbackToFamilyAI(
            tokenData?.message ||
            "LiveAvatar 暂时不可用"
          );
          return;
        }

        const sdk =
          await loadLiveAvatarSdk();

        if (!sdk?.LiveAvatarSession) {
          throw new Error(
            "LiveAvatar SDK 无法载入。"
          );
        }

        liveAvatarSessionToken =
          tokenData.sessionToken;

        const session =
          new sdk.LiveAvatarSession(
            liveAvatarSessionToken,
            {
              voiceChat: false
            }
          );

        liveAvatarSession = session;

        registerLiveAvatarEvents(
          sdk,
          session
        );

        await session.start();

        // 某些浏览器 ready event 很快，补一次 attach。
        setTimeout(
          function () {
            if (
              liveAvatarSession ===
              session
            ) {
              try {
                session.attach(
                  liveAvatarVideo
                );
              } catch {}
            }
          },
          800
        );

        setLiveAvatarUi(
          true,
          `Live Avatar 已开启 · 剩余 ${tokenData.creditsLeft} credits · 声音由 Family AI 播放`
        );

        startLiveAvatarCreditMonitor();
      } catch (error) {
        console.error(
          "LiveAvatar start failed:",
          error
        );

        await fallbackToFamilyAI(
          error?.message ||
          "LiveAvatar 启动失败"

      } finally {
        liveAvatarStarting = false;
        liveAvatarToggle.disabled = false;

    async function audioBlobToPcm24k(
      audioBlob
    ) {
      const arrayBuffer =
        await audioBlob.arrayBuffer();

      const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioContextClass) {
        throw new Error(
          "这个浏览器不支持音频转换。"
        );
      }

      const audioContext =
        new AudioContextClass();

      try {
        const decoded =
          await audioContext.decodeAudioData(
            arrayBuffer.slice(0)
          );

        const sourceLength =
          decoded.length;

        const sourceRate =
          decoded.sampleRate;

        const targetRate = 24000;

        const targetLength =
          Math.max(
            1,
            Math.round(
              sourceLength *
              targetRate /
              sourceRate
            )
          );

        const mono =
          new Float32Array(
            sourceLength
          );

        for (
          let channel = 0;
          channel < decoded.numberOfChannels;
          channel += 1
        ) {
          const channelData =
            decoded.getChannelData(
              channel
            );

          for (
            let i = 0;
            i < sourceLength;
            i += 1
          ) {
            mono[i] +=
              channelData[i] /
              decoded.numberOfChannels;
          }
        }

        const output =
          new Int16Array(
            targetLength
          );

        for (
          let i = 0;
          i < targetLength;
          i += 1
        ) {
          const sourcePosition =
            i * sourceRate /
            targetRate;

          const left =
            Math.floor(
              sourcePosition
            );

          const right =
            Math.min(
              left + 1,
              sourceLength - 1
            );

          const fraction =
            sourcePosition - left;

          const sample =
            mono[left] *
              (1 - fraction) +
            mono[right] *
              fraction;

          const clamped =
            Math.max(
              -1,
              Math.min(1, sample)
            );

          output[i] =
            clamped < 0
              ? clamped * 0x8000
              : clamped * 0x7fff;
        }

        const bytes =
          new Uint8Array(
            output.buffer
          );

        let binary = "";
        const chunkSize = 0x8000;

        for (
          let i = 0;
          i < bytes.length;
          i += chunkSize
        ) {
          binary +=
            String.fromCharCode(
              ...bytes.subarray(
                i,
                i + chunkSize
              )
            );
        }

        return binary;
      } finally {
        await audioContext
          .close()
          .catch(() => {});
      }
    }

    async function sendLipSyncToLiveAvatar(
      audioBlob
    ) {
      if (
        suppressNextSpeechPlayback ||
        !liveAvatarActive ||
        !liveAvatarSession
      ) {
        return {
          sent: false,
          reason: "not_active"
        };
      }

      try {
        const pcm =
          await audioBlobToPcm24k(
            audioBlob
          );

        const eventId =
          liveAvatarSession.repeatAudio(
            pcm
          );

        liveAvatarLastAudioEventId =
          String(eventId || "");

        clearLiveAvatarSpeechWatchdog();

        liveAvatarSpeechWatchdog =
          setTimeout(
            function () {
              liveAvatarState.textContent =
                "Live Avatar 画面已连接；声音由 Family AI 播放";
              setAvatarMode("");
            },
            4500
          );

        setAvatarMode("speaking");

        return {
          sent: true,
          eventId:
            liveAvatarLastAudioEventId
        };
      } catch (error) {
        console.error(
          "LiveAvatar lip-sync send failed:",
          error
        );

        liveAvatarState.textContent =
          "Live Avatar 嘴型暂时不可用；声音继续播放";

        return {
          sent: false,
          reason: "send_failed",
          error
        };
      }
    }

      stopCurrentVoice();

      statusText.textContent = "正在准备妈妈声音";
      hintText.textContent = "请稍等一下";
      setAvatarMode("thinking");

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            action: "tts",
            text: answer,
            userId: selectedProfileId,
            outputLanguage: getSelectedOutputLanguage()
          })
        });

        if (!response.ok) {
          let message = "妈妈声音暂时无法生成";

          try {
            const errorData = await response.json();
            message = errorData?.error || message;
          } catch {
            // Keep default message.
          }

          throw new Error(message);
        }

        const audioBlob = await response.blob();

        if (!audioBlob.size) {
          throw new Error("ElevenLabs 没有返回声音资料");
        }

        // LiveAvatar 只负责画面与嘴型。
        // ElevenLabs 声音永远由 Family AI 本地播放器播放，
        // 即使 LiveAvatar 没回传音轨或嘴型失败，也不会静音。
        if (
          liveAvatarActive &&
          liveAvatarSession
        ) {
          sendLipSyncToLiveAvatar(
            audioBlob
          ).catch((error) => {
            console.warn(
              "LiveAvatar lip-sync background error:",
              error
            );
          });
        }

        currentVoiceObjectUrl =
          URL.createObjectURL(audioBlob);

        currentVoiceAudio = new Audio(
          currentVoiceObjectUrl
        );

        currentVoiceAudio.preload = "auto";
        currentVoiceAudio.muted = false;
        currentVoiceAudio.volume = 1;

        currentVoiceAudio.onplay = function () {
          statusText.textContent = "正在回答";
          hintText.textContent = "再按一次可停止声音";
          setAvatarMode("speaking");
          talkButton.disabled = false;
          startAudioReactiveMouth(currentVoiceAudio);
        };

        currentVoiceAudio.onended = function () {
          stopCurrentVoice();
          setAvatarMode("");
          setBusy(false);
          statusText.textContent = "准备与你对话";
          hintText.textContent = "按一下麦克风开始讲话";
        };

        currentVoiceAudio.onerror = function () {
          stopCurrentVoice();
          setAvatarMode("");
          setBusy(false);
          statusText.textContent = "妈妈声音播放失败";
          hintText.textContent = "文字回答仍然可以使用";
        };

        try {
          await currentVoiceAudio.play();
        } catch (playError) {

          stopCurrentVoice();
          setAvatarMode("");
          setBusy(false);
          statusText.textContent = "请点一下页面后再播放";

        stopCurrentVoice();
        setAvatarMode("");
        setBusy(false);
        statusText.textContent = "妈妈声音暂时无法播放";
        hintText.textContent = "文字回答仍然可以使用";

          "系统",
          error?.message ||
          "ElevenLabs 暂时无法生成阿梅的声音。"
        );
      }
    }

    function shouldSuppressResponseSpeech(
      data,
      originalQuestion = ""
    ) {
      if (data?.suppressSpeech === true) {
        return true;
      }

      const intent = String(
        data?.intent || ""
      ).toLowerCase();

      if (
        intent.startsWith("teaching_") ||
        intent.startsWith("pronunciation_")
      ) {
        return true;
      }

      const source = String(
        data?.source || ""
      ).toLowerCase();

      if (
        source.startsWith("teaching-") ||
        source.startsWith("pronunciation-")
      ) {
        return true;
      }

      // 最后一层保护：明确以“教你”开头的教学输入只显示文字。
      return /^教你\s*[:：]?/u.test(
        String(originalQuestion || "").trim()
      );
    }

    async function askFamilyAI(question) {
      const cleanQuestion = question.trim();

      if (!cleanQuestion || isBusy) {
        return;
      }

      if (dailyLimitReached) {
        showMessage(
          getAiSpeakerName(),
          "今天的一小时已经用完了，先休息一下，明天我们再继续聊。"
        );
        return;
      }

      if (!getSelectedProfile()) {
        openProfileModal();
        return;
      }

      stopCurrentVoice();

      setBusy(true);
      setAvatarMode("thinking");

      showMessage("你", cleanQuestion);

      statusText.textContent = "正在思考";
      hintText.textContent = "请稍等一下";

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: cleanQuestion,
            userId: selectedProfileId,
            outputLanguage: getSelectedOutputLanguage(),
            conversationState,
            messages: conversationMessages,
            personalityDNA: ameiPersonalityDNA
          })
        });

        let data;

        try {
          data = await response.json();
        } catch {
          throw new Error(
            "Worker 没有返回正确的资料格式"
          );
        }

        if (!response.ok || !data.ok) {
          throw new Error(
            data.error || "AI 暂时无法回答"
          );
        }

        const answer =
          typeof data.answer === "string"
            ? data.answer.trim()
            : "";

        if (!answer) {
          throw new Error("AI 没有返回答案");
        }

        if (data.usage) {
          updateUsageUi(data.usage);
        }

        if (data.limitReached) {
          conversationState = null;
        }

        conversationState =
          data.conversationState || null;

        conversationMessages.push({
          role: "user",
          content: cleanQuestion
        });

        conversationMessages.push({
          role: "assistant",
          content: answer
        });

        conversationMessages =
          conversationMessages.slice(-12);

        showMessage(getAiSpeakerName(), answer);

        if (
          shouldSuppressResponseSpeech(
            data,
            cleanQuestion
          )
        ) {
          finishSilentTeachingResponse();
        } else {
          speakAnswer(answer);
        }
      } catch (error) {
        console.error(error);

        setAvatarMode("");
        setBusy(false);

        statusText.textContent = "发生错误";
        hintText.textContent = "可以再试一次";

        showMessage(
          "系统",
          error.message || "连接失败，请稍后再试。"
        );
      }
    }


    function getSupportedAudioMimeType() {
      if (!window.MediaRecorder) {
        return "";
      }

      const candidates = [
        "audio/mp4",
        "audio/webm;codecs=opus",
        "audio/webm",
        "audio/ogg;codecs=opus"
      ];

      return candidates.find(
        (type) => MediaRecorder.isTypeSupported(type)
      ) || "";
    }

    function releaseMicrophoneStream() {
      if (microphoneStopTimer) {
        clearTimeout(microphoneStopTimer);
        microphoneStopTimer = null;
      }

      if (microphoneStream) {
        microphoneStream.getTracks().forEach(
          (track) => track.stop()
        );

        microphoneStream = null;
      }

      mediaRecorder = null;
      recordedAudioChunks = [];
      isRecording = false;
    }

    async function transcribeRecordedAudio(audioBlob) {
      statusText.textContent = "正在识别你说的话";
      hintText.textContent = "请稍等一下";
      setAvatarMode("thinking");
      talkButton.disabled = true;

      const extension =
        audioBlob.type.includes("mp4")
          ? "m4a"
          : audioBlob.type.includes("ogg")
            ? "ogg"
            : "webm";

      const form = new FormData();

      form.append(
        "audio",
        audioBlob,
        `recording.${extension}`
      );

      form.append(
        "outputLanguage",
        getSelectedOutputLanguage()
      );

      const response = await fetch(
        `${WORKER_URL}?action=transcribe`,
        {
          method: "POST",
          body: form
        }
      );

      let data;

      try {
        data = await response.json();
      } catch {
        throw new Error(
          "语音识别没有返回正确的资料"
        );
      }

      if (!response.ok || !data.ok) {
        throw new Error(
          data.error || "语音识别失败"
        );
      }

      const transcript =
        String(data.transcript || "").trim();

      if (!transcript) {
        throw new Error("没有识别到讲话内容");
      }

      showMessage("你", transcript);
      await askFamilyAI(transcript);
    }

    async function startMicrophoneRecording() {
      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia ||
        !window.MediaRecorder
      ) {
        return false;
      }

      stopCurrentVoice();

      try {
        microphoneStream =
          await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            }
          });

        const mimeType = getSupportedAudioMimeType();

        mediaRecorder = mimeType
          ? new MediaRecorder(
              microphoneStream,
              { mimeType }
            )
          : new MediaRecorder(microphoneStream);

        recordedAudioChunks = [];

        mediaRecorder.ondataavailable = function (event) {
          if (event.data && event.data.size > 0) {
            recordedAudioChunks.push(event.data);
          }
        };

        mediaRecorder.onstart = function () {
          isRecording = true;
          isListening = true;

          talkButton.classList.add("active");
          setAvatarMode("listening");

          statusText.textContent = "正在录音";
          hintText.textContent =
            "说完后再按一次麦克风";

          showMessage("你", "我正在听……");

          microphoneStopTimer = setTimeout(
            function () {
              if (
                mediaRecorder &&
                mediaRecorder.state === "recording"
              ) {
                stopMicrophoneRecording();
              }
            },
            45000
          );
        };

        mediaRecorder.onstop = async function () {
          const audioBlob = new Blob(
            recordedAudioChunks,
            {
              type:
                mediaRecorder?.mimeType ||
                mimeType ||
                "audio/webm"
            }
          );

          releaseMicrophoneStream();
          talkButton.classList.remove("active");
          isListening = false;

          if (audioBlob.size < 500) {
            setAvatarMode("");
            setBusy(false);
            talkButton.disabled = false;
            statusText.textContent = "没有听清楚";
            hintText.textContent =
              "请再按一次麦克风讲话";
            return;
          }

          try {
            await transcribeRecordedAudio(audioBlob);
          } catch (error) {
            console.error(
              "Microphone transcription failed:",
              error
            );

            setAvatarMode("");
            setBusy(false);
            talkButton.disabled = false;

            statusText.textContent = "语音识别失败";
            hintText.textContent =
              "可以再试一次或改用文字";

            showMessage(
              "系统",
              error.message ||
              "暂时无法识别录音。"
            );
          }
        };

        mediaRecorder.onerror = function (event) {
          console.error(
            "MediaRecorder error:",
            event.error || event
          );

          releaseMicrophoneStream();
          talkButton.classList.remove("active");
          setAvatarMode("");
          setBusy(false);
          talkButton.disabled = false;

          statusText.textContent = "麦克风发生错误";
          hintText.textContent = "可以再试一次";
        };

        mediaRecorder.start(250);
        return true;
      } catch (error) {
        releaseMicrophoneStream();

        if (
          error?.name === "NotAllowedError" ||
          error?.name === "SecurityError"
        ) {
          showMessage(
            "系统",
            "麦克风权限被关闭。请在 Safari 的网站设置中，把麦克风改为“允许”，然后再试。"
          );
        } else {
          showMessage(
            "系统",
            "暂时无法打开麦克风，可以先用文字输入。"
          );
        }

        statusText.textContent = "无法打开麦克风";
        hintText.textContent =
          "检查权限后再按一次";

        return false;
      }
    }

    function stopMicrophoneRecording() {
      if (
        mediaRecorder &&
        mediaRecorder.state === "recording"
      ) {
        statusText.textContent = "正在处理录音";
        hintText.textContent = "请稍等一下";
        talkButton.disabled = true;
        mediaRecorder.stop();
      }
    }

    function setupSpeechRecognition() {
      if (!SpeechRecognition) {
        recognition = null;
        hintText.textContent =
          "这个浏览器不支持语音识别，请使用下方文字输入。";
        return;
      }

      recognition = new SpeechRecognition();

      /*
        目前先使用中文识别。
        将来加入客家话时再调整。
      */
      recognition.lang =
        getSelectedOutputLanguage() === "zh"
          ? "zh-CN"
          : "zh-TW";

      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      recognition.onstart = function () {
        isListening = true;

        talkButton.classList.add("active");
        setAvatarMode("listening");

        statusText.textContent = "正在听你讲话";
        hintText.textContent = "说完后稍等一下";

        showMessage("你", "我正在听……");
      };

      recognition.onresult = function (event) {
        let transcript = "";

        for (
          let index = event.resultIndex;
          index < event.results.length;
          index += 1
        ) {
          transcript +=
            event.results[index][0].transcript;
        }

        transcript = transcript.trim();

        if (transcript) {
          showMessage("你", transcript);
        }

        const finalResult =
          event.results[event.results.length - 1];

        if (
          finalResult &&
          finalResult.isFinal &&
          transcript
        ) {
          recognition.stop();
          askFamilyAI(transcript);
        }
      };

      recognition.onerror = function (event) {
        isListening = false;

        talkButton.classList.remove("active");
        setAvatarMode("");

        if (event.error === "not-allowed") {
          showMessage(
            "系统",
            "麦克风权限被关闭，请在 Safari 网站设置中允许麦克风。"
          );
        } else if (event.error === "no-speech") {
          showMessage(
            "系统",
            "没有听到声音，请靠近一点再说。"
          );
        } else {
          showMessage(
            "系统",
            "语音识别暂时无法使用，可以改用文字输入。"
          );
        }

        statusText.textContent = "没有识别成功";
        hintText.textContent = "可以再按一次麦克风";
      };

      recognition.onend = function () {
        isListening = false;
        talkButton.classList.remove("active");

        if (!isBusy) {
          setAvatarMode("");
          statusText.textContent = "准备与你对话";
          hintText.textContent =
            "按一下麦克风开始讲话";
        }
      };
    }

    talkButton.addEventListener(
      "click",
      async function () {
        if (
          currentVoiceAudio ||
          (
            "speechSynthesis" in window &&
            window.speechSynthesis.speaking
          )
        ) {
          stopCurrentVoice();
          setAvatarMode("");
          setBusy(false);

          statusText.textContent = "声音已停止";
          hintText.textContent =
            "按一下麦克风继续讲话";

          return;
        }

        if (isRecording) {
          stopMicrophoneRecording();
          return;
        }

        if (isListening && recognition) {
          recognition.stop();
          return;
        }

        if (isBusy) {
          return;
        }

        const mediaRecorderStarted =
          await startMicrophoneRecording();

        if (mediaRecorderStarted) {
          return;
        }

        if (!recognition) {
          textInput.focus();
          return;
        }

        recognition.lang =
          getSelectedOutputLanguage() === "zh"
            ? "zh-CN"
            : "zh-TW";

        try {
          recognition.start();
        } catch (error) {
          console.error(error);
          hintText.textContent =
            "请稍等一秒后再按麦克风";
        }
      }
    );

    textForm.addEventListener(
      "submit",
      function (event) {
        event.preventDefault();

        const question = textInput.value.trim();

        if (!question) {
          textInput.focus();
          return;
        }

        textInput.value = "";
        askFamilyAI(question);
      }
    );

    if ("speechSynthesis" in window) {
      window.speechSynthesis.getVoices();

      window.speechSynthesis.onvoiceschanged =
        function () {
          window.speechSynthesis.getVoices();
        };
    }

    document.addEventListener(
      "visibilitychange",
      function () {
        if (document.visibilityState === "visible") {
          refreshUsage();
        }
      }
    );

    setupSpeechRecognition();
    updateProfileUi();
    updateLanguageUi();
    checkWorkerConnection();

    if (getSelectedProfile()) {
      restartHeartbeat();
      loadProactiveGreeting();
    }
  </script>

  <script type="module">
    import {
      FaceLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304";

    const MODEL_URL =
      "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function makeBox(points, paddingX, paddingY) {
      const xs = points.map((point) => point.x);
      const ys = points.map((point) => point.y);

      const minX = Math.min(...xs);
      const maxX = Math.max(...xs);
      const minY = Math.min(...ys);
      const maxY = Math.max(...ys);

      const width = maxX - minX;
      const height = maxY - minY;

      return {
        x: clamp(minX - width * paddingX, 0, 1),
        y: clamp(minY - height * paddingY, 0, 1),
        width: clamp(
          width * (1 + paddingX * 2),
          0.01,
          1
        ),
        height: clamp(
          height * (1 + paddingY * 2),
          0.008,
          1
        )
      };
    }

    function collect(landmarks, indices) {
      return indices
        .map((index) => landmarks[index])
        .filter(Boolean);
    }

    async function calibrateAmeiAvatar() {
      const image =
        document.getElementById("avatarImage");

      if (!image) return;

      window.reportAmeiFaceMeshStatus?.(
        "loading",
        "正在载入 Face Mesh"
      );

      if (!image.complete) {
        await new Promise((resolve, reject) => {
          image.addEventListener(
            "load",
            resolve,
            { once: true }
          );
          image.addEventListener(
            "error",
            reject,
            { once: true }
          );
        });
      }

      try {
        const vision =
          await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm"
          );

        const faceLandmarker =
          await FaceLandmarker.createFromOptions(
            vision,
            {
              baseOptions: {
                modelAssetPath: MODEL_URL,
                delegate: "GPU"
              },
              runningMode: "IMAGE",
              numFaces: 1,
              outputFaceBlendshapes: false,
              outputFacialTransformationMatrixes: false,
              minFaceDetectionConfidence: 0.45,
              minFacePresenceConfidence: 0.45,
              minTrackingConfidence: 0.45
            }
          );

        const result = faceLandmarker.detect(image);
        const landmarks =
          result?.faceLandmarks?.[0];

        if (!landmarks?.length) {
          throw new Error("没有检测到清楚的人脸");
        }

        const leftEye = makeBox(
          collect(
            landmarks,
            [33, 133, 159, 145, 160, 144]
          ),
          0.14,
          0.22
        );

        const rightEye = makeBox(
          collect(
            landmarks,
            [362, 263, 386, 374, 385, 380]
          ),
          0.14,
          0.22
        );

        const mouth = makeBox(
          collect(
            landmarks,
            [61, 291, 13, 14, 78, 308, 82, 312, 87, 317]
          ),
          0.03,
          0.22
        );

        leftEye.y += leftEye.height * 0.23;
        leftEye.height *= 0.53;

        rightEye.y += rightEye.height * 0.23;
        rightEye.height *= 0.53;

        mouth.x += mouth.width * 0.04;
        mouth.width *= 0.92;
        mouth.y += mouth.height * 0.26;
        mouth.height *= 0.52;

        window.applyAmeiFaceMeshLandmarks?.({
          leftEye,
          rightEye,
          mouth
        });

        faceLandmarker.close();
      } catch (error) {
        console.warn(
          "MediaPipe Face Mesh fallback:",
          error
        );

        window.reportAmeiFaceMeshStatus?.(
          "error",
          "Face Mesh 无法载入，已使用备用校正"
        );
      }
    }

    calibrateAmeiAvatar().catch(function (error) {
      console.warn("Face Mesh startup error:", error);

      window.reportAmeiFaceMeshStatus?.(
        "error",
        "Face Mesh 启动失败，已使用备用坐标"
      );
    });
  </script>
