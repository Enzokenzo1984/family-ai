<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#eee6df">

  <title>Family AI Ultimate v7.2.1 Mandarin Voice Lock</title>

  <style>
    :root {
      --background-top: #f7f2ed;
      --background-bottom: #d9cec4;
      --text-main: #342f2b;
      --text-soft: #776e67;
      --card: rgba(255, 255, 255, 0.76);
      --button: #352f2b;
      --button-active: #594f48;
      --shadow: rgba(61, 48, 38, 0.18);
      --error: #9b3b32;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--background-bottom);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      color: var(--text-main);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: 100%;
      max-width: 460px;
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        calc(18px + env(safe-area-inset-top))
        18px
        calc(22px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      background:
        radial-gradient(
          circle at 50% 15%,
          rgba(255, 255, 255, 0.9),
          transparent 38%
        ),
        linear-gradient(
          180deg,
          var(--background-top),
          var(--background-bottom)
        );
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-name {
      margin: 0;
      font-size: 17px;
      font-weight: 750;
    }

    .connection-status {
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.68);
      color: var(--text-soft);
      font-size: 12px;
      font-weight: 650;
    }

    .connection-status.online {
      color: #306442;
    }

    .connection-status.error {
      color: var(--error);
    }

    .avatar-section {
      width: 100%;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar-frame {
      position: relative;
      width: 340px;
      height: 340px;
      max-width: calc(100vw - 36px);
      max-height: calc(100vw - 36px);
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.86);
      padding: 8px;
      box-shadow:
        0 22px 55px var(--shadow),
        inset 0 0 0 1px rgba(255, 255, 255, 0.85);
      animation: breathe 4.5s ease-in-out infinite;
    }

    .avatar-image,
    .avatar-placeholder {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .avatar-image {
      display: block;
      object-fit: cover;
      object-position: center;
    }

    .avatar-placeholder {
      display: none;
      justify-content: center;
      align-items: center;
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.98),
        rgba(224, 213, 204, 0.9)
      );
      font-size: 112px;
    }

    .avatar-glow {
      position: absolute;
      inset: -14px;
      z-index: -1;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.34);
      filter: blur(14px);
    }

    .avatar-frame.listening {
      animation: listening 0.9s ease-in-out infinite alternate;
    }

    .avatar-frame.thinking {
      animation: thinking 1.4s ease-in-out infinite;
    }

    .avatar-frame.speaking {
      animation: speaking 0.32s ease-in-out infinite alternate;
    }

    .name {
      margin: 17px 0 4px;
      font-size: 29px;
      line-height: 1.2;
    }

    .status {
      margin: 0;
      color: var(--text-soft);
      font-size: 15px;
    }

    .conversation-card {
      width: 100%;
      min-height: 108px;
      margin-top: 18px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 25px;
      background: var(--card);
      box-shadow: 0 14px 35px rgba(61, 48, 38, 0.09);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .speaker-label {
      margin-bottom: 7px;
      color: var(--text-soft);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.5px;
    }

    .message {
      margin: 0;
      font-size: 18px;
      line-height: 1.55;
      word-break: break-word;
    }

    .text-entry {
      width: 100%;
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }

    .text-input {
      min-width: 0;
      flex: 1;
      height: 46px;
      padding: 0 15px;
      border: 1px solid rgba(70, 60, 52, 0.12);
      border-radius: 16px;
      outline: none;
      background: rgba(255, 255, 255, 0.76);
      color: var(--text-main);
      font-size: 16px;
    }

    .text-input:focus {
      border-color: rgba(53, 47, 43, 0.35);
      background: rgba(255, 255, 255, 0.92);
    }

    .send-button {
      width: 66px;
      height: 46px;
      border: 0;
      border-radius: 16px;
      background: rgba(53, 47, 43, 0.9);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .send-button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .controls {
      width: 100%;
      margin-top: auto;
      padding-top: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .talk-button {
      position: relative;
      width: 84px;
      height: 84px;
      border: 0;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--button);
      color: white;
      box-shadow:
        0 16px 35px rgba(52, 47, 43, 0.3),
        inset 0 -2px 0 rgba(0, 0, 0, 0.12);
      cursor: pointer;
      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .talk-button:active {
      transform: scale(0.94);
    }

    .talk-button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .talk-button.active::before {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 3px solid rgba(53, 47, 43, 0.24);
      animation: pulse-ring 1.2s ease-out infinite;
    }

    .microphone-icon {
      font-size: 34px;
      line-height: 1;
    }

    .hint {
      margin: 12px 0 0;
      color: var(--text-soft);
      font-size: 13px;
      text-align: center;
    }

    .small-note {
      margin: 10px 0 0;
      color: rgba(70, 62, 56, 0.58);
      font-size: 11px;
      text-align: center;
      line-height: 1.4;
    }

    @keyframes breathe {
      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-4px) scale(1.018);
      }
    }

    @keyframes speaking {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.04);
      }
    }

    @keyframes listening {
      from {
        transform: scale(1);
        box-shadow:
          0 22px 55px var(--shadow),
          0 0 0 0 rgba(53, 47, 43, 0.16);
      }

      to {
        transform: scale(1.025);
        box-shadow:
          0 22px 55px var(--shadow),
          0 0 0 16px rgba(53, 47, 43, 0);
      }
    }

    @keyframes thinking {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(0.9);
        opacity: 0.8;
      }

      100% {
        transform: scale(1.35);
        opacity: 0;
      }
    }

    @media (max-width: 390px) {
      .avatar-frame {
        width: 320px;
        height: 320px;
      }
    }

    @media (max-height: 780px) {
      .avatar-frame {
        width: 278px;
        height: 278px;
      }

      .avatar-section {
        margin-top: 8px;
      }

      .name {
        margin-top: 11px;
        font-size: 25px;
      }

      .conversation-card {
        min-height: 92px;
        margin-top: 12px;
      }

      .controls {
        padding-top: 12px;
      }

      .talk-button {
        width: 72px;
        height: 72px;
      }
    }

    /* ===== Family User Profile Selector ===== */

    .profile-button {
      border: 0;
      border-radius: 999px;
      padding: 7px 11px;
      background: rgba(255, 255, 255, 0.68);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
    }

    .profile-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(40, 34, 30, 0.42);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .profile-modal.open {
      display: flex;
    }

    .profile-panel {
      width: min(390px, 100%);
      padding: 24px;
      border-radius: 26px;
      background: #f7f2ed;
      box-shadow: 0 24px 70px rgba(30, 24, 20, 0.28);
    }

    .profile-panel h2 {
      margin: 0 0 6px;
      font-size: 25px;
      color: var(--text-main);
    }

    .profile-panel p {
      margin: 0 0 18px;
      color: var(--text-soft);
      line-height: 1.5;
    }

    .profile-options {
      display: grid;
      gap: 10px;
    }

    .profile-option {
      width: 100%;
      border: 1px solid rgba(60, 48, 38, 0.10);
      border-radius: 17px;
      padding: 14px 16px;
      text-align: left;
      background: rgba(255, 255, 255, 0.82);
      color: var(--text-main);
      font-size: 16px;
      font-weight: 750;
      cursor: pointer;
    }

    .profile-option small {
      display: block;
      margin-top: 3px;
      color: var(--text-soft);
      font-size: 12px;
      font-weight: 600;
    }


    .usage-status {
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.60);
      color: var(--text-soft);
      font-size: 12px;
      font-weight: 700;
    }

    .usage-status.warning {
      color: #8a5a12;
      background: rgba(255, 241, 207, 0.82);
    }

    .usage-status.limit {
      color: var(--error);
      background: rgba(255, 226, 222, 0.86);
    }


    .language-button {
      border: 0;
      border-radius: 999px;
      padding: 7px 11px;
      background: rgba(255, 255, 255, 0.68);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
    }

    .language-modal {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(40, 34, 30, 0.42);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .language-modal.open {
      display: flex;
    }

    .language-panel {
      width: min(390px, 100%);
      padding: 24px;
      border-radius: 26px;
      background: #f7f2ed;
      box-shadow: 0 24px 70px rgba(30, 24, 20, 0.28);
    }

    .language-panel h2 {
      margin: 0 0 6px;
      font-size: 25px;
    }

    .language-panel p {
      margin: 0 0 18px;
      color: var(--text-soft);
      line-height: 1.5;
    }

    .language-options {
      display: grid;
      gap: 10px;
    }

    .language-option {
      width: 100%;
      border: 1px solid rgba(60, 48, 38, 0.10);
      border-radius: 17px;
      padding: 14px 16px;
      text-align: left;
      background: rgba(255, 255, 255, 0.82);
      color: var(--text-main);
      font-size: 16px;
      font-weight: 750;
      cursor: pointer;
    }

    .language-option small {
      display: block;
      margin-top: 3px;
      color: var(--text-soft);
      font-size: 12px;
      font-weight: 600;
    }

  </style>
</head>

<body>
  <main class="app">

    <header class="top-bar">
      <p class="app-name">Family AI</p>

      <div style="display:flex; align-items:center; gap:7px;">
        <button
          class="profile-button"
          id="profileButton"
          type="button"
        >
          选择人物
        </button>

        <button
          class="language-button"
          id="languageButton"
          type="button"
        >
          中文
        </button>

        <span
          class="connection-status"
          id="connectionStatus"
        >
          检查连接
        </span>
      </div>
    </header>

    <section class="avatar-section">

      <div class="avatar-frame" id="avatarFrame">
        <div class="avatar-glow"></div>

        <img
          class="avatar-image"
          id="avatarImage"
          src="images/mum.jpg"
          alt="岳母头像"
        >

        <div
          class="avatar-placeholder"
          id="avatarPlaceholder"
        >
          👵🏻
        </div>
      </div>

      <h1 class="name" id="aiDisplayName">妈妈</h1>

      <p class="status" id="statusText">
        正在准备
      </p>

      <p class="usage-status" id="usageStatus">
        今日剩余时间：检查中
      </p>
    </section>

    <section class="conversation-card">
      <div class="speaker-label" id="speakerLabel">
        妈妈 AI
      </div>

      <p class="message" id="messageText">
        正在准备今天的问候……
      </p>
    </section>

    <form class="text-entry" id="textForm">
      <input
        class="text-input"
        id="textInput"
        type="text"
        maxlength="1000"
        autocomplete="off"
        placeholder="输入你想说的话"
        aria-label="输入问题"
      >

      <button
        class="send-button"
        id="sendButton"
        type="submit"
      >
        发送
      </button>
    </form>

    <section class="controls">

      <button
        class="talk-button"
        id="talkButton"
        type="button"
        aria-label="开始讲话"
      >
        <span class="microphone-icon">🎤</span>
      </button>

      <p class="hint" id="hintText">
        按一下麦克风开始讲话
      </p>

      <p class="small-note">
        AI 回答可能会出错，重要事情请自行确认。
      </p>
    </section>

  </main>

  <div
    class="profile-modal"
    id="profileModal"
    aria-hidden="true"
  >
    <div class="profile-panel" role="dialog" aria-modal="true">
      <h2>请选择人物</h2>

      <p>
        系统会根据人物关系，自动使用“妈妈”或“阿梅”的身份回答。
      </p>

      <div class="profile-options">
        <button class="profile-option" type="button" data-profile-id="elaine">
          Elaine
          <small>女儿 · AI 自称：妈妈</small>
        </button>

        <button class="profile-option" type="button" data-profile-id="elian">
          Elian
          <small>女儿 · AI 自称：妈妈</small>
        </button>

        <button class="profile-option" type="button" data-profile-id="ahfen">
          阿芬
          <small>妹妹 · AI 自称：阿梅</small>
        </button>

        <button class="profile-option" type="button" data-profile-id="nick">
          Nick
          <small>儿子 · AI 自称：妈妈</small>
        </button>
      </div>
    </div>
  </div>


  <div
    class="language-modal"
    id="languageModal"
    aria-hidden="true"
  >
    <div class="language-panel" role="dialog" aria-modal="true">
      <h2>回答语言</h2>

      <p>
        无论你用中文、大埔客话或混合语法提问，
        系统都会按照这里选择的语言回答。
      </p>

      <div class="language-options">
        <button class="language-option" type="button" data-language-id="zh">
          中文
          <small>所有回答固定使用中文</small>
        </button>

        <button class="language-option" type="button" data-language-id="hepo">
          客话（大埔腔）
          <small>使用大埔客话核心与家庭适配层</small>
        </button>

        <button class="language-option" type="button" data-language-id="auto">
          自动
          <small>根据这一句输入的语言决定回答语言</small>
        </button>

        <button class="language-option" type="button" data-language-id="bilingual">
          双语
          <small>先大埔客话，再显示中文</small>
        </button>
      </div>
    </div>
  </div>


  <script>
    "use strict";

    /*
      Cloudflare Worker 的完整网址。
    */
    const WORKER_URL =
      "https://family-ai.dominominion1984.workers.dev";

    const FAMILY_USERS = {
      elaine: {
        id: "elaine",
        displayName: "Elaine",
        relation: "女儿",
        aiName: "妈妈"
      },

      elian: {
        id: "elian",
        displayName: "Elian",
        relation: "女儿",
        aiName: "妈妈"
      },

      ahfen: {
        id: "ahfen",
        displayName: "阿芬",
        relation: "妹妹",
        aiName: "阿梅"
      },

      nick: {
        id: "nick",
        displayName: "Nick",
        relation: "儿子",
        aiName: "妈妈"
      }
    };

    const PROFILE_STORAGE_KEY =
      "family-ai-selected-profile-v1";

    const OUTPUT_LANGUAGES = {
      zh: { id: "zh", label: "中文" },
      hepo: { id: "hepo", label: "大埔客话" },
      auto: { id: "auto", label: "自动" },
      bilingual: { id: "bilingual", label: "双语" }
    };

    const LANGUAGE_STORAGE_KEY =
      "family-ai-output-language-v1";

    let selectedOutputLanguage =
      localStorage.getItem(LANGUAGE_STORAGE_KEY) || "zh";

    const languageButton =
      document.getElementById("languageButton");

    const languageModal =
      document.getElementById("languageModal");

    function getSelectedOutputLanguage() {
      return OUTPUT_LANGUAGES[selectedOutputLanguage]
        ? selectedOutputLanguage
        : "zh";
    }

    function updateLanguageUi() {
      const language =
        OUTPUT_LANGUAGES[getSelectedOutputLanguage()];

      languageButton.textContent = language.label;
    }

    function openLanguageModal() {
      languageModal.classList.add("open");
      languageModal.setAttribute("aria-hidden", "false");
    }

    function closeLanguageModal() {
      languageModal.classList.remove("open");
      languageModal.setAttribute("aria-hidden", "true");
    }

    function selectOutputLanguage(languageId) {
      if (!OUTPUT_LANGUAGES[languageId]) return;

      selectedOutputLanguage = languageId;
      localStorage.setItem(
        LANGUAGE_STORAGE_KEY,
        selectedOutputLanguage
      );

      updateLanguageUi();
      closeLanguageModal();

      conversationState = null;
      conversationMessages = [];

      if (recognition) {
        recognition.lang =
          languageId === "zh"
            ? "zh-CN"
            : "zh-TW";
      }

      statusText.textContent =
        `回答语言：${OUTPUT_LANGUAGES[languageId].label}`;

      loadProactiveGreeting();
    }


    let selectedProfileId =
      localStorage.getItem(PROFILE_STORAGE_KEY) || "";

    let conversationState = null;
    let conversationMessages = [];

    const profileButton =
      document.getElementById("profileButton");

    const profileModal =
      document.getElementById("profileModal");

    const aiDisplayName =
      document.getElementById("aiDisplayName");

    function getSelectedProfile() {
      return FAMILY_USERS[selectedProfileId] || null;
    }

    function getAiSpeakerName() {
      const profile = getSelectedProfile();

      return profile
        ? `${profile.aiName} AI`
        : "妈妈 AI";
    }

    function updateProfileUi() {
      const profile = getSelectedProfile();

      if (!profile) {
        profileButton.textContent = "选择人物";
        aiDisplayName.textContent = "妈妈";
        speakerLabel.textContent = "妈妈 AI";
        return;
      }

      profileButton.textContent =
        `${profile.displayName} · ${profile.relation}`;

      aiDisplayName.textContent = profile.aiName;
      speakerLabel.textContent = `${profile.aiName} AI`;
    }

    function openProfileModal() {
      profileModal.classList.add("open");
      profileModal.setAttribute("aria-hidden", "false");
    }

    function closeProfileModal() {
      profileModal.classList.remove("open");
      profileModal.setAttribute("aria-hidden", "true");
    }

    function selectProfile(profileId) {
      if (!FAMILY_USERS[profileId]) {
        return;
      }

      selectedProfileId = profileId;
      localStorage.setItem(
        PROFILE_STORAGE_KEY,
        selectedProfileId
      );

      conversationState = null;
      conversationMessages = [];

      updateProfileUi();
      closeProfileModal();

      const profile = getSelectedProfile();

      showMessage(
        `${profile.aiName} AI`,
        "正在准备今天的问候……"
      );

      statusText.textContent = "正在准备";
      dailyLimitReached = false;
      restartHeartbeat();
      loadProactiveGreeting();
    }

    const avatarImage =
      document.getElementById("avatarImage");

    const avatarPlaceholder =
      document.getElementById("avatarPlaceholder");

    const avatarFrame =
      document.getElementById("avatarFrame");

    const talkButton =
      document.getElementById("talkButton");

    const statusText =
      document.getElementById("statusText");

    const messageText =
      document.getElementById("messageText");

    const speakerLabel =
      document.getElementById("speakerLabel");

    const hintText =
      document.getElementById("hintText");

    const connectionStatus =
      document.getElementById("connectionStatus");

    const textForm =
      document.getElementById("textForm");

    const textInput =
      document.getElementById("textInput");

    const sendButton =
      document.getElementById("sendButton");

    const usageStatus =
      document.getElementById("usageStatus");

    let heartbeatTimer = null;
    let dailyLimitReached = false;

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    let recognition = null;
    let currentUtterance = null;

    function showMessage(speaker, text) {

      messageText.textContent = text;

    function setBusy(busy) {
      isBusy = busy;
      talkButton.disabled = busy;
      sendButton.disabled = busy;
      textInput.disabled = busy;

      if (!busy) {
        talkButton.classList.remove("active");

        if (dailyLimitReached) {
          talkButton.disabled = true;
          sendButton.disabled = true;
          textInput.disabled = true;
        }
      }

    function updateUsageUi(usage) {
      if (!usage) {
        return;
      }

      const remaining =
        Number(usage.remainingMinutes || 0);

      usageStatus.className = "usage-status";

      if (usage.limitReached) {
        dailyLimitReached = true;
        usageStatus.textContent =
          "今天的一小时已经用完";
        usageStatus.classList.add("limit");

        talkButton.disabled = true;
        sendButton.disabled = true;
        textInput.disabled = true;
        return;
      }

      dailyLimitReached = false;
      usageStatus.textContent =
        `今日剩余时间：约 ${remaining} 分钟`;

      if (remaining <= 10) {
        usageStatus.classList.add("warning");
      }

      if (!isBusy) {
        talkButton.disabled = false;
        sendButton.disabled = false;
        textInput.disabled = false;
      }
    }

    async function refreshUsage() {
      const profile = getSelectedProfile();

      if (!profile) {
        return;
      }

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            action: "usage",
            userId: profile.id,
            outputLanguage: getSelectedOutputLanguage()
          })
        });

        const data = await response.json();

        if (data.ok && data.usage) {
          updateUsageUi(data.usage);
        }
      } catch (error) {
        console.error("Usage check failed:", error);
      }
    }

    async function sendHeartbeat() {
      const profile = getSelectedProfile();

      if (
        !profile ||
        dailyLimitReached ||
        document.visibilityState !== "visible"
      ) {
        return;
      }

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            action: "heartbeat",
            userId: profile.id,
            outputLanguage: getSelectedOutputLanguage()
          })
        });

        const data = await response.json();

        if (data.ok && data.usage) {
          updateUsageUi(data.usage);
        }

        if (data.limitReached && data.answer) {
          showMessage(getAiSpeakerName(), data.answer);
          speakAnswer(data.answer);
        }
      } catch (error) {
        console.error("Heartbeat failed:", error);
      }
    }

    function restartHeartbeat() {
      if (heartbeatTimer) {
        clearInterval(heartbeatTimer);
      }

      heartbeatTimer =
        setInterval(sendHeartbeat, 30000);

      refreshUsage();
    }


    function getGreetingPeriod() {
      const hour = new Date().getHours();

      if (hour < 12) {
        return "morning";
      }

      if (hour < 18) {
        return "afternoon";
      }

      return "evening";
    }

    function findChineseVoice() {
      const voices =
        window.speechSynthesis.getVoices();

      return (
        voices.find(function (voice) {
          return voice.lang === "zh-CN";
        }) ||
        voices.find(function (voice) {
          return voice.lang === "zh-TW";
        }) ||
        voices.find(function (voice) {
          return voice.lang === "zh-HK";
        }) ||
        voices.find(function (voice) {
          return voice.lang
            .toLowerCase()
            .startsWith("zh");
        }) ||
        null
      );
    }

    function stopCurrentVoice() {
      if (currentVoiceAudio) {
        currentVoiceAudio.pause();
        currentVoiceAudio.src = "";
        currentVoiceAudio = null;
      }

      if (currentVoiceObjectUrl) {
        URL.revokeObjectURL(currentVoiceObjectUrl);
        currentVoiceObjectUrl = "";
      }

      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }

      currentUtterance = null;
    }

    function speakWithBrowserFallback(answer) {
      if (!("speechSynthesis" in window)) {
        setAvatarMode("");
        setBusy(false);
        statusText.textContent = "回答已经显示";
        hintText.textContent = "妈妈声音暂时无法播放";
        return;
      }

      window.speechSynthesis.cancel();

      currentUtterance =
        new SpeechSynthesisUtterance(answer);

      const voice = findChineseVoice();

      if (voice) {
        currentUtterance.voice = voice;
        currentUtterance.lang = voice.lang;
      } else {
        currentUtterance.lang = "zh-CN";
      }

      currentUtterance.rate = 0.88;
      currentUtterance.pitch = 1;
      currentUtterance.volume = 1;

      currentUtterance.onstart = function () {
        statusText.textContent = "正在回答";
        hintText.textContent = "再按一次可停止声音";
        setAvatarMode("speaking");
        talkButton.disabled = false;
      };

      currentUtterance.onend = function () {
        currentUtterance = null;
        setAvatarMode("");
        setBusy(false);
        statusText.textContent = "准备与你对话";
        hintText.textContent = "按一下麦克风开始讲话";
      };

      currentUtterance.onerror = function () {
        currentUtterance = null;
        setAvatarMode("");
        setBusy(false);
        statusText.textContent = "回答已经显示";
        hintText.textContent = "语音播放失败";
      };

      window.speechSynthesis.speak(currentUtterance);
    }

    async function speakAnswer(answer) {
      stopCurrentVoice();

      statusText.textContent = "正在准备妈妈声音";
      hintText.textContent = "请稍等一下";
      setAvatarMode("thinking");

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            action: "tts",
            text: answer,
            userId: selectedProfileId,
            outputLanguage: getSelectedOutputLanguage()
          })
        });

        if (!response.ok) {
          let message = "妈妈声音暂时无法生成";

          try {
            const errorData = await response.json();
            message = errorData?.error || message;
          } catch {
            // Keep default message.
          }

          throw new Error(message);
        }

        const audioBlob = await response.blob();

        if (!audioBlob.size) {
          throw new Error("ElevenLabs 没有返回声音资料");
        }

        currentVoiceObjectUrl =
          URL.createObjectURL(audioBlob);

        currentVoiceAudio = new Audio(
          currentVoiceObjectUrl
        );

        currentVoiceAudio.preload = "auto";
        currentVoiceAudio.volume = 1;

        currentVoiceAudio.onplay = function () {
          statusText.textContent = "正在回答";
          hintText.textContent = "再按一次可停止声音";
          setAvatarMode("speaking");
          talkButton.disabled = false;
        };

        currentVoiceAudio.onended = function () {
          stopCurrentVoice();
          setAvatarMode("");
          setBusy(false);
          statusText.textContent = "准备与你对话";
          hintText.textContent = "按一下麦克风开始讲话";
        };

        currentVoiceAudio.onerror = function () {
          stopCurrentVoice();
          speakWithBrowserFallback(answer);
        };

        try {
          await currentVoiceAudio.play();
        } catch (playError) {
          console.warn(
            "Clone voice autoplay failed:",
            playError
          );

          stopCurrentVoice();
          speakWithBrowserFallback(answer);
        }
      } catch (error) {
        console.error("ElevenLabs voice failed:", error);
        stopCurrentVoice();
        speakWithBrowserFallback(answer);
      }
    }

    async function askFamilyAI(question) {
      const cleanQuestion = question.trim();

      if (!cleanQuestion || isBusy) {
        return;
      }

      if (dailyLimitReached) {
        showMessage(
          getAiSpeakerName(),
          "今天的一小时已经用完了，先休息一下，明天我们再继续聊。"
        );
        return;
      }

      if (!getSelectedProfile()) {
        openProfileModal();
        return;
      }

      stopCurrentVoice();

      setBusy(true);
      setAvatarMode("thinking");

      showMessage("你", cleanQuestion);

      statusText.textContent = "正在思考";
      hintText.textContent = "请稍等一下";

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: cleanQuestion,
            userId: selectedProfileId,
            outputLanguage: getSelectedOutputLanguage(),
            conversationState,
            messages: conversationMessages
          })
        });

        let data;

        try {
          data = await response.json();
        } catch {
          throw new Error(
            "Worker 没有返回正确的资料格式"
          );
        }

        if (!response.ok || !data.ok) {
          throw new Error(
            data.error || "AI 暂时无法回答"
          );
        }

        const answer =
          typeof data.answer === "string"
            ? data.answer.trim()
            : "";

        if (!answer) {
          throw new Error("AI 没有返回答案");
        }

        if (data.usage) {
          updateUsageUi(data.usage);
        }

        if (data.limitReached) {
          conversationState = null;
        }

        conversationState =
          data.conversationState || null;

        conversationMessages.push({
          role: "user",
          content: cleanQuestion
        });

        conversationMessages.push({
          role: "assistant",
          content: answer
        });

        conversationMessages =
          conversationMessages.slice(-12);

        showMessage(getAiSpeakerName(), answer);
        speakAnswer(answer);
      } catch (error) {
        console.error(error);

        setAvatarMode("");
        setBusy(false);

        statusText.textContent = "发生错误";
        hintText.textContent = "可以再试一次";

        showMessage(
          "系统",
          error.message || "连接失败，请稍后再试。"
        );
      }
    }


    function getSupportedAudioMimeType() {
      if (!window.MediaRecorder) {
        return "";
      }

      const candidates = [
        "audio/mp4",
        "audio/webm;codecs=opus",
        "audio/webm",
        "audio/ogg;codecs=opus"
      ];

      return candidates.find(
        (type) => MediaRecorder.isTypeSupported(type)
      ) || "";
    }

    function releaseMicrophoneStream() {
      if (microphoneStopTimer) {
        clearTimeout(microphoneStopTimer);
        microphoneStopTimer = null;
      }

      if (microphoneStream) {
        microphoneStream.getTracks().forEach(
          (track) => track.stop()
        );

        microphoneStream = null;
      }

      mediaRecorder = null;
      recordedAudioChunks = [];
      isRecording = false;
    }

    async function transcribeRecordedAudio(audioBlob) {
      statusText.textContent = "正在识别你说的话";
      hintText.textContent = "请稍等一下";
      setAvatarMode("thinking");
      talkButton.disabled = true;

      const extension =
        audioBlob.type.includes("mp4")
          ? "m4a"
          : audioBlob.type.includes("ogg")
            ? "ogg"
            : "webm";

      const form = new FormData();

      form.append(
        "audio",
        audioBlob,
        `recording.${extension}`
      );

      form.append(
        "outputLanguage",
        getSelectedOutputLanguage()
      );

      const response = await fetch(
        `${WORKER_URL}?action=transcribe`,
        {
          method: "POST",
          body: form
        }
      );

      let data;

      try {
        data = await response.json();
      } catch {
        throw new Error(
          "语音识别没有返回正确的资料"
        );
      }

      if (!response.ok || !data.ok) {
        throw new Error(
          data.error || "语音识别失败"
        );
      }

      const transcript =
        String(data.transcript || "").trim();

      if (!transcript) {
        throw new Error("没有识别到讲话内容");
      }

      showMessage("你", transcript);
      await askFamilyAI(transcript);
    }

    async function startMicrophoneRecording() {
      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia ||
        !window.MediaRecorder
      ) {
        return false;
      }

      stopCurrentVoice();

      try {
        microphoneStream =
          await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            }
          });

        const mimeType = getSupportedAudioMimeType();

        mediaRecorder = mimeType
          ? new MediaRecorder(
              microphoneStream,
              { mimeType }
            )
          : new MediaRecorder(microphoneStream);

        recordedAudioChunks = [];

        mediaRecorder.ondataavailable = function (event) {
          if (event.data && event.data.size > 0) {
            recordedAudioChunks.push(event.data);
          }
        };

        mediaRecorder.onstart = function () {
          isRecording = true;
          isListening = true;

          talkButton.classList.add("active");
          setAvatarMode("listening");

          statusText.textContent = "正在录音";
          hintText.textContent =
            "说完后再按一次麦克风";

          showMessage("你", "我正在听……");

          microphoneStopTimer = setTimeout(
            function () {
              if (
                mediaRecorder &&
                mediaRecorder.state === "recording"
              ) {
                stopMicrophoneRecording();
              }
            },
            45000
          );
        };

        mediaRecorder.onstop = async function () {
          const audioBlob = new Blob(
            recordedAudioChunks,
            {
              type:
                mediaRecorder?.mimeType ||
                mimeType ||
                "audio/webm"
            }
          );

          releaseMicrophoneStream();
          talkButton.classList.remove("active");
          isListening = false;

          if (audioBlob.size < 500) {
            setAvatarMode("");
            setBusy(false);
            talkButton.disabled = false;
            statusText.textContent = "没有听清楚";
            hintText.textContent =
              "请再按一次麦克风讲话";
            return;
          }

          try {
            await transcribeRecordedAudio(audioBlob);
          } catch (error) {
            console.error(
              "Microphone transcription failed:",
              error
            );

            setAvatarMode("");
            setBusy(false);
            talkButton.disabled = false;

            statusText.textContent = "语音识别失败";
            hintText.textContent =
              "可以再试一次或改用文字";

            showMessage(
              "系统",
              error.message ||
              "暂时无法识别录音。"
            );
          }
        };

        mediaRecorder.onerror = function (event) {
          console.error(
            "MediaRecorder error:",
            event.error || event
          );

          releaseMicrophoneStream();
          talkButton.classList.remove("active");
          setAvatarMode("");
          setBusy(false);
          talkButton.disabled = false;

          statusText.textContent = "麦克风发生错误";
          hintText.textContent = "可以再试一次";
        };

        mediaRecorder.start(250);
        return true;
      } catch (error) {
        releaseMicrophoneStream();

        if (
          error?.name === "NotAllowedError" ||
          error?.name === "SecurityError"
        ) {
          showMessage(
            "系统",
            "麦克风权限被关闭。请在 Safari 的网站设置中，把麦克风改为“允许”，然后再试。"
          );
        } else {
          showMessage(
            "系统",
            "暂时无法打开麦克风，可以先用文字输入。"
          );
        }

        statusText.textContent = "无法打开麦克风";
        hintText.textContent =
          "检查权限后再按一次";

        return false;
      }
    }

    function stopMicrophoneRecording() {
      if (
        mediaRecorder &&
        mediaRecorder.state === "recording"
      ) {
        statusText.textContent = "正在处理录音";
        hintText.textContent = "请稍等一下";
        talkButton.disabled = true;
        mediaRecorder.stop();
      }
    }

    function setupSpeechRecognition() {
      if (!SpeechRecognition) {
        recognition = null;
        hintText.textContent =
          "这个浏览器不支持语音识别，请使用下方文字输入。";
        return;
      }

      recognition = new SpeechRecognition();

      /*
        目前先使用中文识别。
        将来加入客家话时再调整。
      */
      recognition.lang =
        getSelectedOutputLanguage() === "zh"
          ? "zh-CN"
          : "zh-TW";

      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      recognition.onstart = function () {
        isListening = true;

        talkButton.classList.add("active");
        setAvatarMode("listening");

        statusText.textContent = "正在听你讲话";
        hintText.textContent = "说完后稍等一下";

        showMessage("你", "我正在听……");
      };

      recognition.onresult = function (event) {
        let transcript = "";

        for (
          let index = event.resultIndex;
          index < event.results.length;
          index += 1
        ) {
          transcript +=
            event.results[index][0].transcript;
        }

        transcript = transcript.trim();

        if (transcript) {
          showMessage("你", transcript);
        }

        const finalResult =
          event.results[event.results.length - 1];

        if (
          finalResult &&
          finalResult.isFinal &&
          transcript
        ) {
          recognition.stop();
          askFamilyAI(transcript);
        }
      };

      recognition.onerror = function (event) {
        isListening = false;

        talkButton.classList.remove("active");
        setAvatarMode("");

        if (event.error === "not-allowed") {
          showMessage(
            "系统",
            "麦克风权限被关闭，请在 Safari 网站设置中允许麦克风。"
          );
        } else if (event.error === "no-speech") {
          showMessage(
            "系统",
            "没有听到声音，请靠近一点再说。"
          );
        } else {
          showMessage(
            "系统",
            "语音识别暂时无法使用，可以改用文字输入。"
          );
        }

        statusText.textContent = "没有识别成功";
        hintText.textContent = "可以再按一次麦克风";
      };

      recognition.onend = function () {
        isListening = false;
        talkButton.classList.remove("active");

        if (!isBusy) {
          setAvatarMode("");
          statusText.textContent = "准备与你对话";
          hintText.textContent =
            "按一下麦克风开始讲话";
        }
      };
    }

    talkButton.addEventListener(
      "click",
      async function () {
        if (
          currentVoiceAudio ||
          (
            "speechSynthesis" in window &&
            window.speechSynthesis.speaking
          )
        ) {
          stopCurrentVoice();
          setAvatarMode("");
          setBusy(false);

          statusText.textContent = "声音已停止";
          hintText.textContent =
            "按一下麦克风继续讲话";

          return;
        }

        if (isRecording) {
          stopMicrophoneRecording();
          return;
        }

        if (isListening && recognition) {
          recognition.stop();
          return;
        }

        if (isBusy) {
          return;
        }

        const mediaRecorderStarted =
          await startMicrophoneRecording();

        if (mediaRecorderStarted) {
          return;
        }

        if (!recognition) {
          textInput.focus();
          return;
        }

        recognition.lang =
          getSelectedOutputLanguage() === "zh"
            ? "zh-CN"
            : "zh-TW";

        try {
          recognition.start();
        } catch (error) {
          console.error(error);
          hintText.textContent =
            "请稍等一秒后再按麦克风";
        }
      }
    );

    textForm.addEventListener(
      "submit",
      function (event) {
        event.preventDefault();

        const question = textInput.value.trim();

        if (!question) {
          textInput.focus();
          return;
        }

        textInput.value = "";
        askFamilyAI(question);
      }
    );

    if ("speechSynthesis" in window) {
      window.speechSynthesis.getVoices();

      window.speechSynthesis.onvoiceschanged =
        function () {
          window.speechSynthesis.getVoices();
        };
    }

    document.addEventListener(
      "visibilitychange",
      function () {
        if (document.visibilityState === "visible") {
          refreshUsage();
        }
      }
    );

    setupSpeechRecognition();
    updateProfileUi();
    updateLanguageUi();
    checkWorkerConnection();

    if (getSelectedProfile()) {
      restartHeartbeat();
      loadProactiveGreeting();
    }
  </script>
</body>
</html>
