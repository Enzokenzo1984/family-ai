<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#eee6df">

  <title>Family AI</title>

  <style>
    :root {
      --background-top: #f5f0eb;
      --background-bottom: #d9cec4;
      --text-main: #342f2b;
      --text-soft: #776e67;
      --card: rgba(255, 255, 255, 0.72);
      --button: #352f2b;
      --button-active: #594f48;
      --shadow: rgba(61, 48, 38, 0.18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--background-bottom);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      color: var(--text-main);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    button {
      font: inherit;
    }

    .app {
      width: 100%;
      max-width: 460px;
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        calc(20px + env(safe-area-inset-top))
        18px
        calc(24px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      background:
        radial-gradient(
          circle at 50% 16%,
          rgba(255, 255, 255, 0.82),
          transparent 38%
        ),
        linear-gradient(
          180deg,
          var(--background-top),
          var(--background-bottom)
        );
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-name {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .connection-status {
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.62);
      color: var(--text-soft);
      font-size: 12px;
      font-weight: 600;
    }

    .avatar-section {
      width: 100%;
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar-frame {
      position: relative;
      width: 340px;
      height: 340px;
      max-width: calc(100vw - 36px);
      max-height: calc(100vw - 36px);
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.84);
      padding: 8px;
      box-shadow:
        0 22px 55px var(--shadow),
        inset 0 0 0 1px rgba(255, 255, 255, 0.8);
      animation: breathe 4.5s ease-in-out infinite;
    }

    .avatar-image,
    .avatar-placeholder {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .avatar-image {
      display: block;
      object-fit: cover;
      object-position: center;
    }

    .avatar-placeholder {
      display: none;
      justify-content: center;
      align-items: center;
      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.98),
          rgba(224, 213, 204, 0.9)
        );
      font-size: 112px;
      user-select: none;
    }

    .avatar-glow {
      position: absolute;
      inset: -14px;
      z-index: -1;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.32);
      filter: blur(14px);
      opacity: 0.8;
    }

    .avatar-frame.speaking {
      animation: speaking 0.32s ease-in-out infinite alternate;
    }

    .avatar-frame.listening {
      animation: listening 0.9s ease-in-out infinite alternate;
    }

    .name {
      margin: 18px 0 5px;
      font-size: 30px;
      line-height: 1.2;
    }

    .status {
      margin: 0;
      color: var(--text-soft);
      font-size: 15px;
    }

    .conversation-card {
      width: 100%;
      min-height: 112px;
      margin-top: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 26px;
      background: var(--card);
      box-shadow: 0 14px 35px rgba(61, 48, 38, 0.09);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .speaker-label {
      margin-bottom: 8px;
      color: var(--text-soft);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .message {
      margin: 0;
      font-size: 19px;
      line-height: 1.55;
      word-break: break-word;
    }

    .controls {
      width: 100%;
      margin-top: auto;
      padding-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .talk-button {
      position: relative;
      width: 86px;
      height: 86px;
      border: 0;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--button);
      color: white;
      box-shadow:
        0 16px 35px rgba(52, 47, 43, 0.3),
        inset 0 -2px 0 rgba(0, 0, 0, 0.12);
      cursor: pointer;
      transition:
        transform 0.15s ease,
        background 0.15s ease;
    }

    .talk-button:active {
      transform: scale(0.94);
      background: var(--button-active);
    }

    .talk-button.active::before {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 3px solid rgba(53, 47, 43, 0.24);
      animation: pulse-ring 1.2s ease-out infinite;
    }

    .microphone-icon {
      font-size: 34px;
      line-height: 1;
    }

    .hint {
      margin: 13px 0 0;
      color: var(--text-soft);
      font-size: 13px;
    }

    .small-note {
      margin: 15px 0 0;
      color: rgba(70, 62, 56, 0.58);
      font-size: 11px;
      text-align: center;
      line-height: 1.4;
    }

    @keyframes breathe {
      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-4px) scale(1.018);
      }
    }

    @keyframes speaking {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.045);
      }
    }

    @keyframes listening {
      from {
        transform: scale(1);
        box-shadow:
          0 22px 55px var(--shadow),
          0 0 0 0 rgba(53, 47, 43, 0.14);
      }

      to {
        transform: scale(1.025);
        box-shadow:
          0 22px 55px var(--shadow),
          0 0 0 15px rgba(53, 47, 43, 0);
      }
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(0.9);
        opacity: 0.8;
      }

      100% {
        transform: scale(1.35);
        opacity: 0;
      }
    }

    @media (max-width: 390px) {
      .avatar-frame {
        width: 320px;
        height: 320px;
      }
    }

    @media (max-height: 760px) {
      .avatar-frame {
        width: 285px;
        height: 285px;
      }

      .avatar-section {
        margin-top: 10px;
      }

      .name {
        margin-top: 12px;
        font-size: 26px;
      }

      .conversation-card {
        min-height: 96px;
        margin-top: 14px;
      }

      .controls {
        padding-top: 16px;
      }

      .talk-button {
        width: 74px;
        height: 74px;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <header class="top-bar">
      <p class="app-name">Family AI</p>
      <span class="connection-status">Demo Mode</span>
    </header>

    <section class="avatar-section">

      <div class="avatar-frame" id="avatarFrame">
        <div class="avatar-glow"></div>

        <img
          class="avatar-image"
          id="avatarImage"
          src="images/mum.jpg"
          alt="岳母头像"
        >

        <div
          class="avatar-placeholder"
          id="avatarPlaceholder"
          aria-label="预设头像"
        >
          👵🏻
        </div>
      </div>

      <h1 class="name">岳母 AI</h1>

      <p class="status" id="statusText">
        准备与你对话
      </p>
    </section>

    <section class="conversation-card">
      <div class="speaker-label" id="speakerLabel">
        AI
      </div>

      <p class="message" id="messageText">
        你好，按下麦克风试试看。
      </p>
    </section>

    <section class="controls">

      <button
        class="talk-button"
        id="talkButton"
        type="button"
        aria-label="开始讲话"
      >
        <span class="microphone-icon">🎤</span>
      </button>

      <p class="hint" id="hintText">
        按一下开始简单互动
      </p>

      <p class="small-note">
        目前是免费测试版本，还没有连接 ChatGPT。
      </p>
    </section>

  </main>

  <script>
  "use strict";

  const avatarImage = document.getElementById("avatarImage");
  const avatarPlaceholder = document.getElementById("avatarPlaceholder");
  const avatarFrame = document.getElementById("avatarFrame");
  const talkButton = document.getElementById("talkButton");
  const statusText = document.getElementById("statusText");
  const messageText = document.getElementById("messageText");
  const speakerLabel = document.getElementById("speakerLabel");
  const hintText = document.getElementById("hintText");

  const demoReplies = [
    "你好啊，今天过得好吗？",
    "记得吃饭，也要多喝水。",
    "有什么事情，可以慢慢跟我说。",
    "今天辛苦了，先休息一下吧。",
    "很高兴今天又可以和你说话。",
    "不要太担心，事情慢慢处理就好。"
  ];

  let currentUtterance = null;
  let isSpeaking = false;

  avatarImage.addEventListener("load", function () {
    avatarImage.style.display = "block";
    avatarPlaceholder.style.display = "none";
  });

  avatarImage.addEventListener("error", function () {
    avatarImage.style.display = "none";
    avatarPlaceholder.style.display = "flex";
    messageText.textContent =
      "找不到 images/mum.jpg，请检查照片名称和路径。";
  });

  function chooseReply() {
    const index = Math.floor(Math.random() * demoReplies.length);
    return demoReplies[index];
  }

  function resetInterface() {
    isSpeaking = false;

    talkButton.classList.remove("active");
    avatarFrame.classList.remove("speaking");
    avatarFrame.classList.remove("listening");

    statusText.textContent = "准备与你对话";
    hintText.textContent = "按一下开始简单互动";
  }

  function findChineseVoice() {
    const voices = window.speechSynthesis.getVoices();

    return (
      voices.find(function (voice) {
        return voice.lang === "zh-CN";
      }) ||
      voices.find(function (voice) {
        return voice.lang === "zh-TW";
      }) ||
      voices.find(function (voice) {
        return voice.lang === "zh-HK";
      }) ||
      voices.find(function (voice) {
        return voice.lang.toLowerCase().startsWith("zh");
      }) ||
      null
    );
  }

  function speakImmediately() {
    if (!("speechSynthesis" in window)) {
      messageText.textContent =
        "这个浏览器不支援系统语音，请使用 Safari 打开。";
      return;
    }

    const reply = chooseReply();

    speakerLabel.textContent = "岳母 AI";
    messageText.textContent = reply;
    statusText.textContent = "正在回答";
    hintText.textContent = "正在播放测试语音";

    talkButton.classList.add("active");
    avatarFrame.classList.add("speaking");

    /*
      重要：
      不再等待 1.2 秒。
      必须在使用者点击按钮的同一刻播放。
    */
    currentUtterance = new SpeechSynthesisUtterance(reply);

    const chineseVoice = findChineseVoice();

    if (chineseVoice) {
      currentUtterance.voice = chineseVoice;
      currentUtterance.lang = chineseVoice.lang;
    } else {
      currentUtterance.lang = "zh-CN";
    }

    currentUtterance.rate = 0.88;
    currentUtterance.pitch = 1;
    currentUtterance.volume = 1;

    currentUtterance.onstart = function () {
      isSpeaking = true;
      statusText.textContent = "正在回答";
      avatarFrame.classList.add("speaking");
    };

    currentUtterance.onend = function () {
      currentUtterance = null;
      resetInterface();
    };

    currentUtterance.onerror = function (event) {
      console.log("语音错误：", event.error);

      currentUtterance = null;
      resetInterface();

      messageText.textContent =
        "系统语音没有成功播放，请确认使用 Safari，并提高媒体音量。";
    };

    window.speechSynthesis.speak(currentUtterance);
  }

  talkButton.addEventListener("click", function () {
    if (isSpeaking) {
      window.speechSynthesis.cancel();
      currentUtterance = null;
      resetInterface();
      return;
    }

    speakImmediately();
  });

  /*
    预先加载 iPhone 内的语音列表。
  */
  if ("speechSynthesis" in window) {
    window.speechSynthesis.getVoices();

    window.speechSynthesis.onvoiceschanged = function () {
      window.speechSynthesis.getVoices();
    };
  }
</script>
</body>
</html>
