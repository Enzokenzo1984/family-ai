<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#eee6df">

  <title>Family AI</title>

  <style>
    :root {
      --background-top: #f7f2ed;
      --background-bottom: #d9cec4;
      --text-main: #342f2b;
      --text-soft: #776e67;
      --card: rgba(255, 255, 255, 0.76);
      --button: #352f2b;
      --button-active: #594f48;
      --shadow: rgba(61, 48, 38, 0.18);
      --error: #9b3b32;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--background-bottom);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      color: var(--text-main);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: 100%;
      max-width: 460px;
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        calc(18px + env(safe-area-inset-top))
        18px
        calc(22px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      background:
        radial-gradient(
          circle at 50% 15%,
          rgba(255, 255, 255, 0.9),
          transparent 38%
        ),
        linear-gradient(
          180deg,
          var(--background-top),
          var(--background-bottom)
        );
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-name {
      margin: 0;
      font-size: 17px;
      font-weight: 750;
    }

    .connection-status {
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.68);
      color: var(--text-soft);
      font-size: 12px;
      font-weight: 650;
    }

    .connection-status.online {
      color: #306442;
    }

    .connection-status.error {
      color: var(--error);
    }

    .avatar-section {
      width: 100%;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar-frame {
      position: relative;
      width: 340px;
      height: 340px;
      max-width: calc(100vw - 36px);
      max-height: calc(100vw - 36px);
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.86);
      padding: 8px;
      box-shadow:
        0 22px 55px var(--shadow),
        inset 0 0 0 1px rgba(255, 255, 255, 0.85);
      animation: breathe 4.5s ease-in-out infinite;
    }

    .avatar-image,
    .avatar-placeholder {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .avatar-image {
      display: block;
      object-fit: cover;
      object-position: center;
    }

    .avatar-placeholder {
      display: none;
      justify-content: center;
      align-items: center;
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.98),
        rgba(224, 213, 204, 0.9)
      );
      font-size: 112px;
    }

    .avatar-glow {
      position: absolute;
      inset: -14px;
      z-index: -1;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.34);
      filter: blur(14px);
    }

    .avatar-frame.listening {
      animation: listening 0.9s ease-in-out infinite alternate;
    }

    .avatar-frame.thinking {
      animation: thinking 1.4s ease-in-out infinite;
    }

    .avatar-frame.speaking {
      animation: speaking 0.32s ease-in-out infinite alternate;
    }

    .name {
      margin: 17px 0 4px;
      font-size: 29px;
      line-height: 1.2;
    }

    .status {
      margin: 0;
      color: var(--text-soft);
      font-size: 15px;
    }

    .conversation-card {
      width: 100%;
      min-height: 108px;
      margin-top: 18px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 25px;
      background: var(--card);
      box-shadow: 0 14px 35px rgba(61, 48, 38, 0.09);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .speaker-label {
      margin-bottom: 7px;
      color: var(--text-soft);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.5px;
    }

    .message {
      margin: 0;
      font-size: 18px;
      line-height: 1.55;
      word-break: break-word;
    }

    .text-entry {
      width: 100%;
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }

    .text-input {
      min-width: 0;
      flex: 1;
      height: 46px;
      padding: 0 15px;
      border: 1px solid rgba(70, 60, 52, 0.12);
      border-radius: 16px;
      outline: none;
      background: rgba(255, 255, 255, 0.76);
      color: var(--text-main);
      font-size: 16px;
    }

    .text-input:focus {
      border-color: rgba(53, 47, 43, 0.35);
      background: rgba(255, 255, 255, 0.92);
    }

    .send-button {
      width: 66px;
      height: 46px;
      border: 0;
      border-radius: 16px;
      background: rgba(53, 47, 43, 0.9);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .send-button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .controls {
      width: 100%;
      margin-top: auto;
      padding-top: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .talk-button {
      position: relative;
      width: 84px;
      height: 84px;
      border: 0;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--button);
      color: white;
      box-shadow:
        0 16px 35px rgba(52, 47, 43, 0.3),
        inset 0 -2px 0 rgba(0, 0, 0, 0.12);
      cursor: pointer;
      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .talk-button:active {
      transform: scale(0.94);
    }

    .talk-button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .talk-button.active::before {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 3px solid rgba(53, 47, 43, 0.24);
      animation: pulse-ring 1.2s ease-out infinite;
    }

    .microphone-icon {
      font-size: 34px;
      line-height: 1;
    }

    .hint {
      margin: 12px 0 0;
      color: var(--text-soft);
      font-size: 13px;
      text-align: center;
    }

    .small-note {
      margin: 10px 0 0;
      color: rgba(70, 62, 56, 0.58);
      font-size: 11px;
      text-align: center;
      line-height: 1.4;
    }

    @keyframes breathe {
      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-4px) scale(1.018);
      }
    }

    @keyframes speaking {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.04);
      }
    }

    @keyframes listening {
      from {
        transform: scale(1);
        box-shadow:
          0 22px 55px var(--shadow),
          0 0 0 0 rgba(53, 47, 43, 0.16);
      }

      to {
        transform: scale(1.025);
        box-shadow:
          0 22px 55px var(--shadow),
          0 0 0 16px rgba(53, 47, 43, 0);
      }
    }

    @keyframes thinking {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(0.9);
        opacity: 0.8;
      }

      100% {
        transform: scale(1.35);
        opacity: 0;
      }
    }

    @media (max-width: 390px) {
      .avatar-frame {
        width: 320px;
        height: 320px;
      }
    }

    @media (max-height: 780px) {
      .avatar-frame {
        width: 278px;
        height: 278px;
      }

      .avatar-section {
        margin-top: 8px;
      }

      .name {
        margin-top: 11px;
        font-size: 25px;
      }

      .conversation-card {
        min-height: 92px;
        margin-top: 12px;
      }

      .controls {
        padding-top: 12px;
      }

      .talk-button {
        width: 72px;
        height: 72px;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <header class="top-bar">
      <p class="app-name">Family AI</p>

      <span
        class="connection-status"
        id="connectionStatus"
      >
        检查连接
      </span>
    </header>

    <section class="avatar-section">

      <div class="avatar-frame" id="avatarFrame">
        <div class="avatar-glow"></div>

        <img
          class="avatar-image"
          id="avatarImage"
          src="images/mum.jpg"
          alt="岳母头像"
        >

        <div
          class="avatar-placeholder"
          id="avatarPlaceholder"
        >
          👵🏻
        </div>
      </div>

      <h1 class="name">岳母 AI</h1>

      <p class="status" id="statusText">
        正在准备
      </p>
    </section>

    <section class="conversation-card">
      <div class="speaker-label" id="speakerLabel">
        岳母 AI
      </div>

      <p class="message" id="messageText">
        你好，按麦克风讲话，或者在下面输入问题。
      </p>
    </section>

    <form class="text-entry" id="textForm">
      <input
        class="text-input"
        id="textInput"
        type="text"
        maxlength="1000"
        autocomplete="off"
        placeholder="输入你想说的话"
        aria-label="输入问题"
      >

      <button
        class="send-button"
        id="sendButton"
        type="submit"
      >
        发送
      </button>
    </form>

    <section class="controls">

      <button
        class="talk-button"
        id="talkButton"
        type="button"
        aria-label="开始讲话"
      >
        <span class="microphone-icon">🎤</span>
      </button>

      <p class="hint" id="hintText">
        按一下麦克风开始讲话
      </p>

      <p class="small-note">
        AI 回答可能会出错，重要事情请自行确认。
      </p>
    </section>

  </main>

  <script>
    "use strict";

    /*
      Cloudflare Worker 的完整网址。
    */
    const WORKER_URL =
      "https://family-ai.dominominion1984.workers.dev";

    const avatarImage =
      document.getElementById("avatarImage");

    const avatarPlaceholder =
      document.getElementById("avatarPlaceholder");

    const avatarFrame =
      document.getElementById("avatarFrame");

    const talkButton =
      document.getElementById("talkButton");

    const statusText =
      document.getElementById("statusText");

    const messageText =
      document.getElementById("messageText");

    const speakerLabel =
      document.getElementById("speakerLabel");

    const hintText =
      document.getElementById("hintText");

    const connectionStatus =
      document.getElementById("connectionStatus");

    const textForm =
      document.getElementById("textForm");

    const textInput =
      document.getElementById("textInput");

    const sendButton =
      document.getElementById("sendButton");

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    let recognition = null;
    let currentUtterance = null;
    let isListening = false;
    let isBusy = false;

    avatarImage.addEventListener("load", function () {
      avatarImage.style.display = "block";
      avatarPlaceholder.style.display = "none";
    });

    avatarImage.addEventListener("error", function () {
      avatarImage.style.display = "none";
      avatarPlaceholder.style.display = "flex";

      showMessage(
        "系统",
        "找不到 images/mum.jpg，请检查照片名称和路径。"
      );
    });

    function setAvatarMode(mode) {
      avatarFrame.classList.remove(
        "listening",
        "thinking",
        "speaking"
      );

      if (mode) {
        avatarFrame.classList.add(mode);
      }
    }

    function showMessage(speaker, text) {
      speakerLabel.textContent = speaker;
      messageText.textContent = text;
    }

    function setBusy(busy) {
      isBusy = busy;
      talkButton.disabled = busy;
      sendButton.disabled = busy;
      textInput.disabled = busy;

      if (!busy) {
        talkButton.classList.remove("active");
      }
    }

    async function checkWorkerConnection() {
      try {
        const response = await fetch(WORKER_URL, {
          method: "GET",
          cache: "no-store"
        });

        const data = await response.json();

        if (response.ok && data.ok) {
          connectionStatus.textContent = "AI 已连接";
          connectionStatus.className =
            "connection-status online";

          statusText.textContent = "准备与你对话";
          return;
        }

        throw new Error("Worker 回应异常");
      } catch (error) {
        connectionStatus.textContent = "连接失败";
        connectionStatus.className =
          "connection-status error";

        statusText.textContent = "无法连接 AI";
      }
    }

    function findChineseVoice() {
      const voices =
        window.speechSynthesis.getVoices();

      return (
        voices.find(function (voice) {
          return voice.lang === "zh-CN";
        }) ||
        voices.find(function (voice) {
          return voice.lang === "zh-TW";
        }) ||
        voices.find(function (voice) {
          return voice.lang === "zh-HK";
        }) ||
        voices.find(function (voice) {
          return voice.lang
            .toLowerCase()
            .startsWith("zh");
        }) ||
        null
      );
    }

    function speakAnswer(answer) {
      if (!("speechSynthesis" in window)) {
        setBusy(false);
        setAvatarMode("");
        statusText.textContent = "回答完成";
        return;
      }

      window.speechSynthesis.cancel();

      currentUtterance =
        new SpeechSynthesisUtterance(answer);

      const voice = findChineseVoice();

      if (voice) {
        currentUtterance.voice = voice;
        currentUtterance.lang = voice.lang;
      } else {
        currentUtterance.lang = "zh-CN";
      }

      currentUtterance.rate = 0.88;
      currentUtterance.pitch = 1;
      currentUtterance.volume = 1;

      currentUtterance.onstart = function () {
        statusText.textContent = "正在回答";
        hintText.textContent = "再按一次可停止声音";
        setAvatarMode("speaking");

        talkButton.disabled = false;
      };

      currentUtterance.onend = function () {
        currentUtterance = null;
        setAvatarMode("");
        setBusy(false);

        statusText.textContent = "准备与你对话";
        hintText.textContent = "按一下麦克风开始讲话";
      };

      currentUtterance.onerror = function () {
        currentUtterance = null;
        setAvatarMode("");
        setBusy(false);

        statusText.textContent = "回答已经显示";
        hintText.textContent = "系统语音播放失败";
      };

      window.speechSynthesis.speak(currentUtterance);
    }

    async function askFamilyAI(question) {
      const cleanQuestion = question.trim();

      if (!cleanQuestion || isBusy) {
        return;
      }

      window.speechSynthesis.cancel();

      setBusy(true);
      setAvatarMode("thinking");

      showMessage("你", cleanQuestion);

      statusText.textContent = "正在思考";
      hintText.textContent = "请稍等一下";

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: cleanQuestion
          })
        });

        let data;

        try {
          data = await response.json();
        } catch {
          throw new Error(
            "Worker 没有返回正确的资料格式"
          );
        }

        if (!response.ok || !data.ok) {
          throw new Error(
            data.error || "AI 暂时无法回答"
          );
        }

        const answer =
          typeof data.answer === "string"
            ? data.answer.trim()
            : "";

        if (!answer) {
          throw new Error("AI 没有返回答案");
        }

        showMessage("岳母 AI", answer);
        speakAnswer(answer);
      } catch (error) {
        console.error(error);

        setAvatarMode("");
        setBusy(false);

        statusText.textContent = "发生错误";
        hintText.textContent = "可以再试一次";

        showMessage(
          "系统",
          error.message || "连接失败，请稍后再试。"
        );
      }
    }

    function setupSpeechRecognition() {
      if (!SpeechRecognition) {
        recognition = null;
        hintText.textContent =
          "这个浏览器不支持语音识别，请使用下方文字输入。";
        return;
      }

      recognition = new SpeechRecognition();

      /*
        目前先使用中文识别。
        将来加入客家话时再调整。
      */
      recognition.lang = "zh-CN";
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      recognition.onstart = function () {
        isListening = true;

        talkButton.classList.add("active");
        setAvatarMode("listening");

        statusText.textContent = "正在听你讲话";
        hintText.textContent = "说完后稍等一下";

        showMessage("你", "我正在听……");
      };

      recognition.onresult = function (event) {
        let transcript = "";

        for (
          let index = event.resultIndex;
          index < event.results.length;
          index += 1
        ) {
          transcript +=
            event.results[index][0].transcript;
        }

        transcript = transcript.trim();

        if (transcript) {
          showMessage("你", transcript);
        }

        const finalResult =
          event.results[event.results.length - 1];

        if (
          finalResult &&
          finalResult.isFinal &&
          transcript
        ) {
          recognition.stop();
          askFamilyAI(transcript);
        }
      };

      recognition.onerror = function (event) {
        isListening = false;

        talkButton.classList.remove("active");
        setAvatarMode("");

        if (event.error === "not-allowed") {
          showMessage(
            "系统",
            "麦克风权限被关闭，请在 Safari 网站设置中允许麦克风。"
          );
        } else if (event.error === "no-speech") {
          showMessage(
            "系统",
            "没有听到声音，请靠近一点再说。"
          );
        } else {
          showMessage(
            "系统",
            "语音识别暂时无法使用，可以改用文字输入。"
          );
        }

        statusText.textContent = "没有识别成功";
        hintText.textContent = "可以再按一次麦克风";
      };

      recognition.onend = function () {
        isListening = false;
        talkButton.classList.remove("active");

        if (!isBusy) {
          setAvatarMode("");
          statusText.textContent = "准备与你对话";
          hintText.textContent =
            "按一下麦克风开始讲话";
        }
      };
    }

    talkButton.addEventListener("click", function () {
      /*
        AI 正在朗读时，按一下可停止。
      */
      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();

        currentUtterance = null;
        setAvatarMode("");
        setBusy(false);

        statusText.textContent = "声音已停止";
        hintText.textContent =
          "按一下麦克风继续讲话";

        return;
      }

      if (!recognition) {
        textInput.focus();
        return;
      }

      if (isListening) {
        recognition.stop();
        return;
      }

      try {
        recognition.start();
      } catch (error) {
        console.error(error);

        hintText.textContent =
          "请稍等一秒后再按麦克风";
      }
    });

    textForm.addEventListener(
      "submit",
      function (event) {
        event.preventDefault();

        const question = textInput.value.trim();

        if (!question) {
          textInput.focus();
          return;
        }

        textInput.value = "";
        askFamilyAI(question);
      }
    );

    if ("speechSynthesis" in window) {
      window.speechSynthesis.getVoices();

      window.speechSynthesis.onvoiceschanged =
        function () {
          window.speechSynthesis.getVoices();
        };
    }

    setupSpeechRecognition();
    checkWorkerConnection();
  </script>
</body>
</html>
